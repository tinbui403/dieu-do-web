<!doctype html>
<!-- MÃ NGUỒN: sửa file này rồi chạy `python build.py` để tạo index.html. Đừng sửa trực tiếp index.html. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<title>Điều độ · Đại Cát Lâm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231E3A8A'/%3E%3Cpath d='M4 15h9V8H4zM13 10.5h3l2.5 2.5v2H13z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Ccircle cx='7' cy='17' r='1.6' fill='white'/%3E%3Ccircle cx='16' cy='17' r='1.6' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  /* ─── Nền & bề mặt ─── */
  --bg:#EFF6FF;
  --surface:rgba(255,255,255,.88);
  --ink:#0F172A;--muted:#475569;--faint:#94A3B8;
  --line:rgba(148,163,184,.28);--line2:rgba(148,163,184,.14);
  --soft:rgba(255,255,255,.55);--soft2:rgba(255,255,255,.36);
  /* ─── Xanh chính ─── */
  --pri:#2563EB;--pri-ink:#1D4ED8;--pri-soft:#DBEAFE;
  /* ─── Sidebar navy ─── */
  --side:#1E3A8A;--side-ink:rgba(255,255,255,.9);
  --side-h:rgba(255,255,255,.52);--side-sub:rgba(255,255,255,.42);
  /* ─── Trạng thái ─── */
  --red:#DC2626;--red-bg:rgba(220,38,38,.1);--red-ink:#B91C1C;
  --amb:#D97706;--amb-bg:rgba(217,119,6,.1);--amb-ink:#92400E;
  --teal:#059669;--teal-bg:rgba(5,150,105,.1);--teal-ink:#065F46;--green-ink:#14532D;
  --lav:rgba(37,99,235,.1);--lav-ink:#1D4ED8;--zalo:#0068FF;
  --font:'Be Vietnam Pro','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(135deg,#EFF6FF 0%,#DBEAFE 30%,#BFDBFE 65%,#93C5FD 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--font);font-size:14px;
  line-height:1.45;-webkit-text-size-adjust:100%
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:var(--pri-ink)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.mono{font-family:var(--mono);font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─── Layout ─── */
.app{display:flex;min-height:100vh}
.side{
  width:236px;flex-shrink:0;
  background:linear-gradient(180deg,#1E3A8A 0%,#1E40AF 55%,#1D4ED8 100%);
  color:#fff;display:flex;flex-direction:column;gap:20px;
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
  box-shadow:4px 0 24px rgba(30,58,138,.18)
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-logo{
  width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border:1px solid rgba(255,255,255,.25)
}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--side-sub)}
.nav-h{padding:0 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-h)}
.nav-g{display:flex;flex-direction:column;gap:3px}
.nav-i{
  display:flex;align-items:center;gap:10px;width:100%;min-height:40px;
  padding:0 10px;border:0;border-radius:8px;
  background:transparent;color:var(--side-ink);font-size:14px;font-weight:500;text-align:left;
  transition:background .15s
}
.nav-i:hover{background:rgba(255,255,255,.12)}
.nav-i[aria-current="page"]{
  background:rgba(255,255,255,.2);color:#fff;font-weight:600;
  box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.nav-i .cnt{
  margin-left:auto;min-width:24px;padding:1px 7px;
  border-radius:999px;font-size:12px;font-weight:600;text-align:center;
  background:rgba(255,255,255,.18);color:#fff
}
.nav-i[aria-current="page"] .cnt{background:rgba(255,255,255,.95);color:var(--pri-ink)}
.langs{display:flex;gap:4px;padding:4px;border-radius:10px;background:rgba(255,255,255,.12)}
.langs button{flex:1;min-height:34px;border:0;border-radius:8px;background:transparent;color:var(--side-ink);font-size:13px;font-weight:600}
.langs button[aria-pressed="true"]{background:rgba(255,255,255,.9);color:var(--pri-ink)}
.me{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.18)}
.avatar{
  width:34px;height:34px;border-radius:999px;
  background:linear-gradient(135deg,#3B82F6,#1D4ED8);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;flex-shrink:0;box-shadow:0 2px 8px rgba(29,78,216,.35)
}
.me .out{border:0;background:transparent;color:var(--side-sub);font-size:12px;text-decoration:underline;padding:4px 6px;white-space:nowrap}
.th-sort{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;white-space:nowrap}
.th-sort.on{color:var(--pri-ink)}
.th-sort:hover{text-decoration:underline}
.me-acts{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end}
.pw-row{position:relative}
.pw-row input{padding-right:78px!important}
.pw-eye{position:absolute;right:4px;top:4px;bottom:4px;border:0;border-radius:6px;background:var(--soft);color:var(--pri-ink);font-size:12px;font-weight:600;padding:0 10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(20px) saturate(1.8);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  border-bottom:1px solid rgba(255,255,255,.65);
  display:flex;align-items:center;gap:14px;padding:12px 28px;min-height:70px;
  box-shadow:0 4px 20px rgba(30,58,138,.07)
}
.top h1{margin:0;font-size:21px;font-weight:700;color:var(--pri-ink);letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.6);align-items:center;justify-content:center}
.search{position:relative;width:300px}
.search svg{position:absolute;left:12px;top:12px}
.search input{
  width:100%;height:40px;padding:0 12px 0 36px;border-radius:10px;
  border:1px solid rgba(148,163,184,.35);
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px)
}
.content{padding:22px 28px 60px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:99px;background:#94A3B8;display:inline-block}
.live.on i{background:#10B981;box-shadow:0 0 6px rgba(16,185,129,.5)}
.bottom-nav{display:none}
.scrim{display:none}

/* ─── Controls ─── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:40px;padding:0 16px;border-radius:10px;
  border:1px solid rgba(148,163,184,.4);
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--pri-ink);font-weight:600;font-size:14px;white-space:nowrap;
  text-decoration:none;transition:all .15s
}
.btn:hover{background:rgba(255,255,255,.92);border-color:rgba(148,163,184,.6)}
.btn-pri{
  background:linear-gradient(135deg,#3B82F6,#2563EB);
  border-color:#2563EB;color:#fff;
  box-shadow:0 2px 12px rgba(37,99,235,.35)
}
.btn-pri:hover{background:linear-gradient(135deg,#2563EB,#1D4ED8);box-shadow:0 4px 16px rgba(37,99,235,.45)}
.btn-sm{min-height:34px;padding:0 11px;font-size:12px;border-radius:8px}
.btn-ok{background:rgba(5,150,105,.1);border-color:rgba(5,150,105,.35);color:var(--teal-ink)}
.btn-zalo{background:var(--zalo);border-color:var(--zalo);color:#fff}
.btn-line{border-color:var(--pri);color:var(--pri-ink)}
.btn-danger{border-color:rgba(220,38,38,.35);color:var(--red-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{
  min-height:36px;padding:0 14px;border-radius:999px;
  border:1px solid rgba(148,163,184,.35);
  background:rgba(255,255,255,.65);backdrop-filter:blur(8px);
  color:var(--ink);font-size:13px;font-weight:600
}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.35)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pri-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-size:12px;font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--pri)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{
  height:40px;padding:0 10px;border-radius:8px;
  border:1px solid rgba(148,163,184,.35);
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:14px;font-weight:400;color:var(--ink);width:100%
}
.field textarea{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--soft);color:var(--muted)}
.field.chkf{flex-direction:row;align-items:center;gap:8px;min-height:40px}
.field.chkf input{width:18px;height:18px;accent-color:var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}

/* ─── Cards & Tables ─── */
.stack{display:flex;flex-direction:column;gap:18px}
.card{
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(16px) saturate(1.8);
  -webkit-backdrop-filter:blur(16px) saturate(1.8);
  border:1px solid rgba(255,255,255,.7);
  border-radius:14px;padding:18px 20px;
  box-shadow:0 4px 24px rgba(30,58,138,.07),0 1px 3px rgba(30,58,138,.04)
}
.card h2{margin:0;font-size:15px;font-weight:700}
.band{display:flex;align-items:center;gap:12px}
.band span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
.band i{flex:1;height:1px;background:rgba(148,163,184,.3)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
.tile{display:flex;flex-direction:column;gap:10px}
.tile .lab{font-size:13px;font-weight:600;color:var(--muted)}
.tile .val{font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.tile .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--faint)}
.tag{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.tbl{
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px) saturate(1.8);
  -webkit-backdrop-filter:blur(14px) saturate(1.8);
  border:1px solid rgba(255,255,255,.68);
  border-radius:14px;overflow:hidden;
  box-shadow:0 4px 20px rgba(30,58,138,.06)
}
.tbl-x{overflow-x:auto}
.tbl-h{
  display:flex;align-items:center;gap:10px;padding:12px 18px;
  background:rgba(219,234,254,.45);
  border-bottom:1px solid rgba(148,163,184,.2);flex-wrap:wrap
}
.tbl-h h2{margin:0;font-size:15px;font-weight:700;color:var(--pri-ink)}
.tr{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:0 18px;min-height:44px;border-bottom:1px solid rgba(148,163,184,.12);min-width:var(--minw,0)}
.tr:last-child{border-bottom:0}
.tr.th{min-height:36px;font-size:12px;font-weight:600;color:var(--muted);background:rgba(219,234,254,.3)}
.tr:not(.th):hover{background:rgba(219,234,254,.4)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk{background:none;border:0;padding:0;color:var(--pri-ink);text-align:left;font-size:13px}
.lk:hover{text-decoration:underline}
.lk.mono{font-size:13px}
.cnt-b{padding:1px 9px;border-radius:999px;background:var(--pri-soft);color:var(--pri-ink);font-size:12px;font-weight:700}
.empty{
  padding:40px 20px;text-align:center;
  background:rgba(255,255,255,.55);
  border:1px dashed rgba(148,163,184,.45);
  border-radius:14px;color:var(--muted)
}
.bar-bg{height:10px;border-radius:5px;background:rgba(148,163,184,.2)}
.bar{height:10px;border-radius:5px}
.heat-row{display:grid;grid-template-columns:190px repeat(14,minmax(0,1fr)) 36px;gap:4px;align-items:center}
.heat-c{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.legend-i{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 8px;border:0;border-radius:6px;background:transparent;width:100%;text-align:left;font-size:13px}
.legend-i:hover{background:rgba(219,234,254,.45)}
.todo-i{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;width:100%;text-align:left;font-size:13px}
.todo-i:hover{background:rgba(219,234,254,.45)}
.todo-i b{min-width:32px;padding:2px 8px;border-radius:6px;background:var(--lav);color:var(--pri-ink);text-align:center}

/* ─── Suggestions ─── */
.gy-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
.gy-card{
  display:flex;align-items:stretch;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.65);
  border-radius:12px;box-shadow:0 2px 12px rgba(30,58,138,.06)
}
.gy-card.sel{
  border:2px solid var(--pri);
  box-shadow:0 4px 20px rgba(37,99,235,.2)
}
.gy-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:12px 16px;border:0;background:transparent;text-align:left}
.gy-side{
  display:flex;flex-direction:column;justify-content:center;gap:6px;
  padding:10px 14px;background:rgba(219,234,254,.35);
  border-radius:0 12px 12px 0;min-width:140px
}
.panel{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.order{
  margin:0;white-space:pre-wrap;font-family:var(--mono),'Noto Sans SC',monospace;
  font-size:12px;line-height:1.6;
  background:rgba(219,234,254,.35);
  border:1px solid rgba(148,163,184,.25);border-radius:8px;padding:12px
}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}

/* ─── Drawer / Modal ─── */
.drawer-wrap{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(15,23,42,.28);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.drawer-wrap>.close-area{flex:1;border:0;background:transparent}
.drawer{
  width:560px;max-width:100%;height:100%;overflow-y:auto;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:-8px 0 40px rgba(15,23,42,.18);display:flex;flex-direction:column
}
.drawer-h{
  position:sticky;top:0;z-index:2;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(148,163,184,.2);padding:16px 20px;display:flex;align-items:flex-start;gap:12px
}
.drawer-b{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.drawer-f{
  position:sticky;bottom:0;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(148,163,184,.2);
  padding:12px 20px;display:flex;gap:10px;justify-content:flex-end
}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;line-height:1.3;color:var(--muted)}
.step b{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:99px;font-size:12px;background:rgba(148,163,184,.15);color:var(--faint)}
.step.done b{background:var(--pri-soft);color:var(--pri-ink)}
.step.cur b{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.step.cur{color:var(--ink);font-weight:600}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h3{margin:0;font-size:13px;font-weight:700;color:var(--pri-ink)}
.x-btn{
  width:40px;height:40px;border-radius:10px;
  border:1px solid rgba(148,163,184,.35);
  background:rgba(255,255,255,.65);
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}

/* ─── Toast & Login ─── */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;
  padding:12px 18px;border-radius:10px;
  background:rgba(15,23,42,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:#fff;font-size:13px;font-weight:500;
  box-shadow:0 8px 32px rgba(15,23,42,.3);max-width:min(640px,calc(100vw - 32px));display:none
}
#toast.show{display:block}
#toast.err{background:var(--red)}
.login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:linear-gradient(135deg,#EFF6FF 0%,#DBEAFE 30%,#BFDBFE 65%,#93C5FD 100%)
}
.login-card{
  width:420px;max-width:100%;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);
  border:1px solid rgba(255,255,255,.7);
  border-radius:16px;padding:28px;
  box-shadow:0 16px 48px rgba(30,58,138,.16);
  display:flex;flex-direction:column;gap:16px
}
.login-card h1{margin:0;font-size:22px;color:var(--pri-ink)}
.tabs2{
  display:flex;gap:4px;padding:4px;border-radius:10px;
  background:rgba(219,234,254,.45)
}
.tabs2 button{flex:1;min-height:36px;border:0;border-radius:8px;background:transparent;font-weight:600;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{
  background:rgba(255,255,255,.9);color:var(--pri-ink);
  box-shadow:0 1px 3px rgba(30,58,138,.12)
}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--lav);color:var(--lav-ink)}
.msg.err{background:var(--red-bg);color:var(--red-ink)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

/* ─── Responsive ─── */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gy-layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
}

        '<label class="field">' + esc(T('pickCarrier')) + '<select data-on="gy-pick" data-id="' + esc(sel.id) + '"' + (canPlan() ? '' : ' disabled') + '>' + '<option value="">—</option>' + S.nhaxe.map(n => '<option value="' + esc(n.ma) + '"' + (n.ma === sel.nx ? ' selected' : '') + '>' + esc(n.ma + (n.ten_day_du && n.ten_day_du !== n.ma ? ' · ' + n.ten_day_du : '')) + '</option>').join('') + '</select></label>') +

        '</span></div>').join('') + '</div></section>';
    }).join('') + '<p class="muted" style="font-size:12px;margin:0">' + esc(T1('"Đánh dấu đã chạy" sẽ tự cập nhật trạng thái cont: cont đầy → vào bãi hoặc hạ cảng theo nơi hạ; đơn rỗng → cont đã tới kho.', '"标记已执行"会自动更新柜子状态：满柜→进堆场或回港；空柜订单→已到厂。')) + '</p></div>';
  };

  // ====== TAB 3: YARD STATUS ======
  const renderYard = () => vTaiKho();

  // ====== RENDER TABS ======
  const tabButtons = '<div class="chips" style="gap:8px">' +
    '<button class="chip" data-act="wf-tab" data-tab="suggestions" aria-pressed="' + (tab === 'suggestions' ? 'true' : 'false') + '">' + esc(T('goi_y') + ' (' + all.filter(g => !g.duyet).length + ')') + '</button>' +
    '<button class="chip" data-act="wf-tab" data-tab="today" aria-pressed="' + (tab === 'today' ? 'true' : 'false') + '">' + esc(T('today') + ' (' + all.filter(g => g.duyet && !g.da_ap_dung).length + ')') + '</button>' +
    '<button class="chip" data-act="wf-tab" data-tab="yard" aria-pressed="' + (tab === 'yard' ? 'true' : 'false') + '">' + esc(T('yard') + ' (' + S.conts.filter(c => c.trang_thai <= '3').length + ')') + '</button>' +
  '</div>';

  const content = {
    'suggestions': renderSuggestions(),
    'today': renderToday(),
    'yard': renderYard()
  }[tab] || renderSuggestions();

  return '<div class="stack" style="gap:14px">' + tabButtons + content + '</div>';
}

const LO_SORTS = [['closing', ['Closing gần nhất', '截关时间']], ['thu_tu', ['Thứ tự tự đặt', '自定顺序']], ['lo', ['Số lô', '批次号']], ['etd', ['ETD', 'ETD']], ['booking', ['Booking', '订舱号']], ['hang_tau', ['Hãng tàu', '船公司']], ['so_luong', ['Số lượng cont', '柜数']], ['moi', ['Mới cập nhật', '最近更新']]];
function loKey(l, k) {
  if (k === 'closing') return l.closing ? +new Date(l.closing) : null;
  if (k === 'etd') return l.etd || l.etd_kho || null;
  if (k === 'moi') return l.cap_nhat_luc ? +new Date(l.cap_nhat_luc) : null;
  if (k === 'so_luong') return l.so_luong_cont != null ? l.so_luong_cont : (l.so_cont || null);
  if (k === 'thu_tu') return l.thu_tu != null ? l.thu_tu : null;
  return l[k] == null || l[k] === '' ? null : l[k];
}
function sortLots(arr) {
  const k = LO_SORT.k, d = LO_SORT.d;
  return arr.sort((a, b) => {
    const x = loKey(a, k), y = loKey(b, k);
    if (x == null && y == null) return String(a.lo).localeCompare(String(b.lo), 'vi', { numeric:true });
    if (x == null) return 1; if (y == null) return -1;   // ô trống luôn nằm cuối
    const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'vi', { numeric:true });
    return (r || String(a.lo).localeCompare(String(b.lo), 'vi', { numeric:true })) * d;
  });
}
function setLoSort(k, d) { LO_SORT = { k, d }; try { localStorage.setItem('dd_lo_sort', JSON.stringify(LO_SORT)); } catch (e) {} renderMain(); }
function sortHead(k, label, extra) {

  let body;

  else if (r.hanh_dong === 'xoa') body = '<span style="color:var(--red-ink)">' + esc(T1('Đã xoá hẳn', '已删除')) + '</span>' + (d.so_cont || d.booking ? ' <span class="muted">(' + esc([d.so_cont, d.booking].filter(Boolean).join(' · ')) + ')</span>' : '');

function formObj(form) {
  const o = {};
  form.querySelectorAll('input[name],select[name],textarea[name]').forEach(el => {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'datetime-local') o[el.name] = inputToTs(el.value);
    else if (el.type === 'number') o[el.name] = el.value === '' ? null : Number(el.value);
    else { const v = el.value.trim(); o[el.name] = v === '' ? null : v; }
  });
  return o;
}
async function saveCont(form) {
  const o = formObj(form); if (o.so_cont) o.so_cont = o.so_cont.toUpperCase().replace(/\s+/g, '');
  const id = S.drawer && S.drawer.id;
  const btn = document.getElementById('save-btn'); if (btn) { btn.disabled = true; btn.textContent = T('saving'); }
  try {
    if (id) await q(sb.from('cont').update(o).eq('id', id));
    else { if (!o.kho) throw new Error(T('required') + ': ' + T('kho')); if (o.so_cont && o.lo) o.id = o.so_cont + '-' + o.lo; await q(sb.from('cont').insert(o)); }
    closeDrawer(); await loadData();
    if (!id) {
      const st = o.trang_thai || '1';
      if (['1', '2', '3'].indexOf(st) > -1) S.tkSeg = st;
      if (['1', '2', '3', '4'].indexOf(st) > -1) S.boardSeg = st;
      toast(T1('Đã thêm — cont nằm ở mục “' + stLabel(st) + '”', '已新增，位于“' + stLabel(st) + '”'));
      if (o.lo && S.lots[o.lo]) { renderMain(); openLo(S.lots[o.lo]); }
      else if (['1', '2', '3', '4'].indexOf(st) > -1) { S.tab = 'board'; renderShell(); renderMain(); }
      else renderMain();
    } else { toast(T('saved')); renderMain(); }
    renderNavCounts();
  } catch (e) { toast(errMsg(e), true); if (btn) { btn.disabled = false; btn.textContent = T('save'); } }
}
async function saveLo(form) {
  const o = formObj(form), id = S.drawer && S.drawer.id;
  const d = { kho:o.d_kho, khach_hang:o.d_khach_hang, ma_don:o.d_ma_don, ngay_can_len_kho:o.d_can };
  ['d_kho', 'd_khach_hang', 'd_ma_don', 'd_can'].forEach(k => { delete o[k]; });
  let nDon = 0;
  const btn = document.getElementById('save-btn'); if (btn) { btn.disabled = true; btn.textContent = T('saving'); }
  try {
    if (id) await q(sb.from('lo').update(o).eq('lo', id));
    else {
      if (!o.lo) throw new Error(T('required') + ': ' + T('loCol'));
      await q(sb.from('lo').insert(o));
      if (d.kho && o.so_luong_cont > 0) {
        const rows = []; for (let i = 0; i < o.so_luong_cont; i++) rows.push({ lo:o.lo, kho:d.kho, khach_hang:d.khach_hang, ma_don:d.ma_don, ngay_can_len_kho:d.ngay_can_len_kho, trang_thai:'1', ngay_goi_cont:todayVN(), nguon:'web' });
        try { await q(sb.from('cont').insert(rows)); nDon = rows.length; }
        catch (e) { toast(T1('Đã lưu lô nhưng chưa tạo được đơn: ', '批次已保存，但订单未建成：') + errMsg(e), true); }
      }
    }
    closeDrawer(); await loadData(); renderMain(); renderNavCounts();
    if (!id && S.lots[o.lo]) { openLo(S.lots[o.lo]); if (nDon || !(d.kho && o.so_luong_cont > 0)) toast(nDon ? T1('Đã thêm lô ' + o.lo + ' và ' + nDon + ' đơn chờ cắt rỗng', '已新增批次 ' + o.lo + ' 及 ' + nDon + ' 个待提空订单') : T1('Đã thêm lô ' + o.lo + ' — bấm “Thêm đơn / cont” để thêm cont vào lô', '已新增批次 ' + o.lo + '，点“新增订单/柜”添加柜子')); }
    else toast(T('saved'));
  } catch (e) { toast(errMsg(e), true); if (btn) { btn.disabled = false; btn.textContent = T('save'); } }
}

  if (to === '4') { patch.gio_vao_bai = c.gio_vao_bai || now; patch.bai_tam = c.bai_tam || S.cauhinh['Bãi tạm mặc định'] || 'HLS'; }

  try { await q(sb.from('cont').update(patch).eq('id', id)); toast((c.so_cont || c.ma_don || id) + ' → ' + stLabel(to)); await loadData(); renderMain(); renderNavCounts(); if (S.drawer && S.drawer.kind === 'cont' && S.drawer.id === id) openContById(id); }
  catch (e) { toast(errMsg(e), true); }
}

async function applyGy(id) {

    }
    if (g.id_cont_rong) {
      if (typeKey(g.loai_lenh) === 'dong') {
        const bai = (String(g.noi_ha || '').match(/Seal tạm (\w+)/) || [])[1];
        const toPort = /^Seal chính/.test(g.noi_ha || '');
        await q(sb.from('cont').update(Object.assign({ ngay_den_kho: todayVN(), nha_xe: nx, du_kien_day: now }, toPort ? { trang_thai:'5' } : { trang_thai:'4', bai_tam: bai || S.cauhinh['Bãi tạm mặc định'] || 'HLS', gio_vao_bai: now })).eq('id', g.id_cont_rong));

  } catch (e) { toast(errMsg(e), true); }
}
async function saveDm(form) {
  const kind = form.dataset.form, key = form.dataset.key, o = {};
  form.querySelectorAll('[name]').forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? null : Number(el.value)) : (el.value.trim() === '' ? null : el.value.trim()); });
  try {
    if (kind === 'gia') {
      const nx = key ? key.split('||')[0] : o.nha_xe, kv = key ? key.split('||')[1] : o.khu_vuc;
      if (!nx || !kv) throw new Error(T('required'));
      const up = [], del = [];
      GIA_LOAI.forEach(x => { const v = o['g_' + x[0]]; if (v == null) del.push(x[0]); else up.push({ nha_xe:nx, khu_vuc:kv, loai:x[0], gia:v, ghi_chu:o.ghi_chu }); });
      if (up.length) await q(sb.from('bang_gia_xe').upsert(up));
      if (del.length && key) await q(sb.from('bang_gia_xe').delete().eq('nha_xe', nx).eq('khu_vuc', kv).in('loai', del));
    } else {
      const tbl = { nhaxe:'nha_xe', kho:'kho', nv:'nhan_vien', bai:'bai_tam', cangden:'cang_den', cangha:'cang_ha' }[kind], pk = { nhaxe:'ma', kho:'ten', nv:'email', bai:'ma', cangden:'ma', cangha:'ten' }[kind];
      if (key) { delete o[pk]; await q(sb.from(tbl).update(o).eq(pk, key)); }
      else { if (!o[pk]) throw new Error(T('required')); if (kind === 'nhaxe' || kind === 'bai') o[pk] = o[pk].toUpperCase(); await q(sb.from(tbl).insert(o)); }
    }
    toast(T('saved')); await loadCatalogs(); renderMain();
  } catch (e) { toast(errMsg(e), true); }
}
/* ---------------- tạo / đặt mật khẩu tài khoản nhân viên (Quản lý, qua Edge Function) ---------------- */
async function callNhanVienFn(action, payload) {
  const { data:sess } = await sb.auth.getSession();
  if (!sess || !sess.session) throw new Error(T1('Phiên đăng nhập đã hết, tải lại trang.', '登录已过期，请刷新页面。'));
  const r = await fetch(SUPABASE_URL + '/functions/v1/quan-ly-nhan-vien', {
    method:'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + sess.session.access_token, 'apikey':SUPABASE_KEY },
    body: JSON.stringify(Object.assign({ action }, payload))
  });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j.ok) throw new Error(j.error || ('Lỗi (' + r.status + ')'));
  return j;
}
async function createNhanVien(form) {
  const o = {}; form.querySelectorAll('[name]').forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : (el.value.trim() === '' ? null : el.value.trim()); });
  if (!o.email) { toast(T('required'), true); return; }
  if (!o.password || o.password.length < 6) { toast(T1('Mật khẩu tạm cần ít nhất 6 ký tự.', '临时密码至少6位。'), true); return; }
  const b = form.querySelector('[type=submit]'); if (b) b.disabled = true;
  try {
    await callNhanVienFn('create_employee', { email:o.email.toLowerCase(), password:o.password, ho_ten:o.ho_ten, vai_tro:o.vai_tro, ngon_ngu:o.ngon_ngu, nha_xe:o.nha_xe, hoat_dong:o.hoat_dong });
    toast(T1('Đã tạo tài khoản cho ' + o.email, '已为 ' + o.email + ' 建号')); await loadCatalogs(); renderMain();
  } catch (e) { toast(errMsg(e), true); if (b) b.disabled = false; }
}
async function setNhanVienPassword(form) {
  const email = form.dataset.key, password = (form.querySelector('[name=password]') || {}).value || '';
  if (password.length < 6) { toast(T1('Mật khẩu mới cần ít nhất 6 ký tự.', '新密码至少6位。'), true); return; }
  const b = form.querySelector('[type=submit]'); if (b) b.disabled = true;
  try {
    await callNhanVienFn('set_password', { email, password });
    toast(T1('Đã đặt lại mật khẩu cho ' + email, '已重置 ' + email + ' 的密码')); form.reset();
  } catch (e) { toast(errMsg(e), true); }
  if (b) b.disabled = false;
}

    catch (e) { el.disabled = false; toast(errMsg(e), true); }
  },
  'cp-del': async d => { try { await q(sb.from('chi_phi_cont').delete().eq('id', +d.id)); toast(T1('Đã xoá', '已删除')); await loadData(); renderMain(); openContById(d.cont); } catch (e) { toast(errMsg(e), true); } },
  'dm-del': async (d, el) => {
    const k = d.kind + ':' + d.key;
    if (S.confirmDel !== k) { S.confirmDel = k; el.innerHTML = '<b style="font-size:11px;color:var(--red-ink)">?</b>'; toast(T1('Bấm ✕ lần nữa để xoá ' + d.key, '再点一次删除 ' + d.key)); setTimeout(() => { if (S.confirmDel === k) { S.confirmDel = null; if (el.isConnected) el.innerHTML = ico('x', 12); } }, 4000); return; }
    S.confirmDel = null;
    try {
      if (d.kind === 'nv') { await q(sb.rpc('xoa_nhan_vien', { p_email:d.key })); toast(T1('Đã xoá nhân viên ' + d.key, '已删除员工')); }
      else if (d.kind === 'kho' || d.kind === 'nhaxe') { const r = await q(sb.rpc(d.kind === 'kho' ? 'xoa_kho' : 'xoa_nha_xe', d.kind === 'kho' ? { p_ten:d.key } : { p_ma:d.key })); toast(r.data === 'ngung' ? T1(d.key + ' đã có dữ liệu → chuyển “ngưng dùng”', '已有记录，已停用') : T1('Đã xoá ' + d.key, '已删除')); }
      else { const tbl = { cangden:'cang_den', cangha:'cang_ha' }[d.kind], pk = { cangden:'ma', cangha:'ten' }[d.kind]; if (!tbl) throw new Error('kind?'); await q(sb.from(tbl).delete().eq(pk, d.key)); toast(T1('Đã xoá ' + d.key, '已删除')); }
      await loadCatalogs(); renderMain();
    } catch (e) { toast(errMsg(e), true); }
  },
  'don-run': async (d, el) => {
    const ds = Array.from(document.querySelectorAll('.don-cb:checked')).map(x => x.value);
    if (!ds.length) { toast(T1('Chưa chọn lô nào.', '未选择批次。'), true); return; }
    if (S.confirmDel !== 'don') { S.confirmDel = 'don'; el.textContent = T1('Bấm lần nữa để xoá ' + ds.length + ' lô', '再点一次删除 ' + ds.length + ' 批'); setTimeout(() => { if (S.confirmDel === 'don') { S.confirmDel = null; if (el.isConnected) el.textContent = T1('Xoá các lô đã chọn khỏi Supabase', '从Supabase删除所选批次'); } }, 5000); return; }
    S.confirmDel = null; el.disabled = true;
    try { const r = await q(sb.rpc('don_du_lieu', { p_ds:ds })); toast(T1('Đã dọn ' + r.data + ' lô khỏi Supabase', '已清理 ' + r.data + ' 批')); loadDon(); }
    catch (e) { el.disabled = false; toast(errMsg(e), true); }
  },
  'huy-lo': async (d, el) => {
    const inp = document.getElementById('huy-ly-do'), why = inp ? inp.value.trim() : '';
    if (why.length < 3) { toast(T1('Cần ghi lý do hủy lô.', '请填写取消原因。'), true); if (inp) inp.focus(); return; }
    if (S.confirmDel !== 'huy-' + d.lo) { S.confirmDel = 'huy-' + d.lo; el.textContent = T1('Bấm lần nữa để hủy lô ' + d.lo, '再点一次确认取消 ' + d.lo); setTimeout(() => { if (S.confirmDel === 'huy-' + d.lo) { S.confirmDel = null; if (el.isConnected) el.textContent = T1('Hủy lô', '取消批次'); } }, 5000); return; }
    S.confirmDel = null; el.disabled = true;
    try { const r = await q(sb.rpc('huy_lo', { p_lo:d.lo, p_ly_do:why })); toast(T1('Đã hủy lô ' + d.lo + (r.data ? ' · ' + r.data + ' đơn chuyển sang Hủy' : ''), '已取消批次 ' + d.lo)); await loadData(); renderMain(); renderNavCounts(); if (S.lots[d.lo]) openLo(S.lots[d.lo]); else closeDrawer(); }
    catch (e) { el.disabled = false; el.textContent = T1('Hủy lô', '取消批次'); toast(errMsg(e), true); }
  },
  'khoi-phuc-lo': async (d, el) => {
    el.disabled = true;
    try { const r = await q(sb.rpc('khoi_phuc_lo', { p_lo:d.lo })); toast(T1('Đã khôi phục lô ' + d.lo + (r.data ? ' · ' + r.data + ' đơn quay lại Chờ cắt rỗng' : ''), '已恢复批次 ' + d.lo)); await loadData(); renderMain(); renderNavCounts(); if (S.lots[d.lo]) openLo(S.lots[d.lo]); }
    catch (e) { el.disabled = false; toast(errMsg(e), true); }
  },
  'lo-sort': d => setLoSort(d.k, LO_SORT.k === d.k ? -LO_SORT.d : (d.k === 'moi' ? -1 : 1)),
  'lo-dir': () => setLoSort(LO_SORT.k, -LO_SORT.d),

  'run-goiy': () => runGoiY(),
  'gy-type': d => { S.gyType = d.v; renderMain(); }, 'gy-pri': d => { S.gyPri = d.v; renderMain(); },
  'gy-sel': d => { S.sel = d.id; renderMain(); if (window.innerWidth < 1180) { const p = document.querySelector('.panel'); if (p) p.scrollIntoView({ behavior:'smooth', block:'start' }); } },
  'gy-approve': d => approveGy(d.id, d.v === '1'),
  'gy-apply': d => { if (S.confirmApply === d.id) applyGy(d.id); else { S.confirmApply = d.id; renderMain(); setTimeout(() => { if (S.confirmApply === d.id) { S.confirmApply = null; renderMain(); } }, 4000); } },
  'copy-gy': async (d, el) => { const g = S.goiy.find(x => x.id === d.id); if (!g) return; await copyText(gyView(g).text); S.copied = d.id; toast(T('copied')); if (!d.keep) renderMain(); },
  'copy-grp': async (d) => { const t = S.goiy.filter(g => g.duyet && !g.da_ap_dung).map(gyView).filter(g => (g.nx || '—') === d.nx).map(g => g.text).join('\n\n'); await copyText(t); S.copied = 'grp-' + d.nx; toast(T('copied')); if (!d.keep) renderMain(); },
  'tk-seg': d => { S.tkSeg = d.v; renderMain(); },
  'board-seg': d => { S.boardSeg = d.v; renderMain(); },
  'move': d => moveCont(d.id, d.to),
  'kd-done': async d => { try { await q(sb.from('lo').update({ da_kiem_dich:true }).eq('lo', d.lo)); toast(T('loCol') + ' ' + d.lo + ' · ' + T('kdDone')); await loadData(); renderMain(); renderNavCounts(); if (S.drawer && S.drawer.kind === 'lo' && S.drawer.id === d.lo && S.lots[d.lo]) openLo(S.lots[d.lo]); } catch (e) { toast(errMsg(e), true); } },
  'kd-undo': async d => { try { await q(sb.from('lo').update({ da_kiem_dich:false }).eq('lo', d.lo)); toast(T('loCol') + ' ' + d.lo + ' · ' + T1('đã bỏ tích kiểm dịch', '已取消检疫勾选')); await loadData(); renderMain(); renderNavCounts(); if (S.drawer && S.drawer.kind === 'lo' && S.drawer.id === d.lo && S.lots[d.lo]) openLo(S.lots[d.lo]); } catch (e) { toast(errMsg(e), true); } },
  'open-cont': d => openContById(d.id),
  'open-lo': async d => { let l = S.lots[d.lo]; if (!l) { try { const r = await q(sb.from('lo_tong_hop').select('*').eq('lo', d.lo)); l = r.data[0]; if (l) S.lots[l.lo] = l; } catch (e) { toast(errMsg(e), true); return; } } if (l) openLo(l); },
  'new-cont': d => openCont({ trang_thai:'1', lo: d.lo || null }),
  'new-lo': () => openLo({}),
  'open-kd-wizard': d => KD_WIZARD.open(d.lo),
  'close-wizard': () => KD_WIZARD.close(),
  'kd-wizard-sel': d => KD_WIZARD.selectCont(d.id),
  'kd-next-step': () => KD_WIZARD.nextStep(),
  'kd-prev-step': () => KD_WIZARD.prevStep(),
  'kd-wizard-save': () => KD_WIZARD.save(),
  'close-drawer': () => closeDrawer(),
  'dm-tab': d => { S.dmTab = d.v; renderMain(); if (d.v === 'nk') loadNhatKy(); if (d.v === 'don') loadDon(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; if (!ACT[act]) return;
  if (el.tagName !== 'A') e.preventDefault();
  ACT[act](el.dataset, el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.on === 'gy-hide') { S.gyHide = el.checked; renderMain(); }
  else if (el.dataset.on === 'lo-open') { S.loOpen = el.checked; renderMain(); }
  else if (el.dataset.on === 'lo-huy') { S.loHuy = el.checked; renderMain(); }
  else if (el.dataset.on === 'bai-sort') { S.baiSort = el.value; renderMain(); }
  else if (el.dataset.on === 'hc-all') { S.hcAll = el.checked; renderMain(); }
  else if (el.dataset.on === 'don-all') { document.querySelectorAll('.don-cb').forEach(x => { x.checked = el.checked; }); }
  else if (el.dataset.on === 'nk-bang') { S.nkBang = el.value; loadNhatKy(); }
  else if (el.dataset.on === 'lo-sortk') setLoSort(el.value, el.value === 'moi' ? -1 : 1);
  else if (el.dataset.on === 'gy-pick') { S.pick[el.dataset.id] = el.value; const g = S.goiy.find(x => x.id === el.dataset.id); if (g && g.duyet) { sb.from('goi_y').update({ nha_xe_chon: el.value || null }).eq('id', g.id).then(r => { if (r.error) toast(errMsg(r.error), true); else g.nha_xe_chon = el.value || null; }); } renderMain(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'topq' || el.id === 'bigq') {
    S.q = el.value; S.results = null;
    if (S.tab !== 'tim') { S.tab = 'tim'; renderShell(); const b = document.getElementById('bigq'); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }
    else { const other = document.getElementById(el.id === 'topq' ? 'bigq' : 'topq'); if (other) other.value = el.value; }
    doSearch();
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === 'f-cont') saveCont(f);
  else if (f.dataset.form === 'f-lo') saveLo(f);
  else if (['nhaxe', 'kho', 'nv', 'bai', 'gia', 'cangden', 'cangha'].indexOf(f.dataset.form) > -1) saveDm(f);
  else if (f.dataset.form === 'nv-new') createNhanVien(f);
  else if (f.dataset.form === 'setpw') setNhanVienPassword(f);
  else if (f.id === 'login-form') doLogin(f);
  else if (f.id === 'reset-form') doResetPw(f);
  else if (f.dataset.form === 'f-pw') savePw(f);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.drawer) closeDrawer(); });

/* ---------------- đăng nhập ---------------- */
let LOGIN_EMAIL = '';
// Trang mở từ link trong mail đặt lại mật khẩu -> không vào thẳng app, bắt đặt mật khẩu mới trước
let RECOVERY = /type=recovery/.test(location.hash || '');
function pwField(label, name, auto) {
  return '<div class="field">' + label + '<div class="pw-row"><input name="' + name + '" type="password" autocomplete="' + auto + '" minlength="6" required aria-label="' + esc(label) + '"><button type="button" class="pw-eye" data-act="pw-eye">Hiện 显示</button></div></div>';
}
function renderLogin(msg, isErr) {
  document.getElementById('root').innerHTML = '<div class="login"><form class="login-card" id="login-form">' +
    '<div class="brand" style="padding:0"><div class="brand-logo" style="background:var(--side)">' + ico('truck', 22, '#fff') + '</div><div><div class="brand-name" style="color:var(--pri-ink)">Điều độ 调度</div><div class="muted" style="font-size:12px">Đại Cát Lâm · cont chuối</div></div></div>' +
    '<label class="field">Email 邮箱<input name="email" type="email" autocomplete="email" required value="' + esc(LOGIN_EMAIL) + '"></label>' +
    pwField('Mật khẩu 密码', 'password', 'current-password') +
    '<div style="text-align:right;margin-top:-6px"><button type="button" data-act="login-forgot" style="background:none;border:0;padding:0;color:var(--pri-ink);font-size:12px;cursor:pointer;text-decoration:underline">Quên mật khẩu? 忘记密码？</button></div>' +
    (msg ? '<div class="msg' + (isErr ? ' err' : '') + '">' + esc(msg) + '</div>' : '') +
    '<button class="btn btn-pri" type="submit" id="login-btn" style="min-height:44px">Đăng nhập 登录</button>' +
    '<p class="muted" style="margin:0;font-size:12px">Chưa có tài khoản? Nhờ Quản lý tạo tài khoản cho bạn — trang này không mở đăng ký tự do. 还没有账号？请管理员为您建号——本页不开放自助注册。</p>' +
  '</form></div>';
  const inp = document.querySelector(LOGIN_EMAIL ? '#login-form [name=password]' : '#login-form [name=email]'); if (inp) inp.focus();
}
ACT['pw-eye'] = (d, el) => { const i = el.parentNode.querySelector('input'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.textContent = show ? 'Ẩn 隐藏' : 'Hiện 显示'; };
ACT['login-forgot'] = async () => {
  const f = document.getElementById('login-form');
  const email = (f && f.email.value.trim().toLowerCase()) || '';
  if (!email) { renderLogin('Nhập email vào ô trên rồi bấm lại “Quên mật khẩu?”. 请先填写邮箱再点“忘记密码”。', true); return; }
  LOGIN_EMAIL = email;
  try {
    const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (r.error) throw r.error;
    renderLogin('Đã gửi mail đặt lại mật khẩu tới ' + email + '. Mở hộp thư, bấm link trong mail rồi đặt mật khẩu mới. 重置密码邮件已发送，请查收。');
  } catch (e) { renderLogin(errMsg(e), true); }
};
function renderResetPw(msg, isErr) {
  document.getElementById('root').innerHTML = '<div class="login"><form class="login-card" id="reset-form">' +
    '<div class="brand" style="padding:0"><div class="brand-logo" style="background:var(--side)">' + ico('truck', 22, '#fff') + '</div><div><div class="brand-name" style="color:var(--pri-ink)">Điều độ 调度</div><div class="muted" style="font-size:12px">Đặt mật khẩu mới 设置新密码</div></div></div>' +
    pwField('Mật khẩu mới 新密码', 'p1', 'new-password') +
    pwField('Nhập lại mật khẩu mới 再次输入', 'p2', 'new-password') +
    (msg ? '<div class="msg' + (isErr ? ' err' : '') + '">' + esc(msg) + '</div>' : '') +
    '<button class="btn btn-pri" type="submit" id="reset-btn" style="min-height:44px">Lưu mật khẩu 保存密码</button>' +
    '<p class="muted" style="margin:0;font-size:12px">Ít nhất 6 ký tự. Lưu xong là vào thẳng trang luôn. 至少6位，保存后直接进入。</p>' +
  '</form></div>';
  const i = document.querySelector('#reset-form [name=p1]'); if (i) i.focus();
}
async function doResetPw(f) {
  const p1 = f.p1.value, p2 = f.p2.value;
  if (p1.length < 6) { renderResetPw('Mật khẩu cần ít nhất 6 ký tự. 密码至少6位。', true); return; }
  if (p1 !== p2) { renderResetPw('Hai lần nhập không giống nhau. 两次输入不一致。', true); return; }
  const b = document.getElementById('reset-btn'); if (b) { b.disabled = true; b.textContent = 'Đang lưu… 保存中…'; }
  try {
    const r = await sb.auth.updateUser({ password: p1 }); if (r.error) throw r.error;
    RECOVERY = false;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    const { data } = await sb.auth.getSession();
    if (data.session) afterLogin(data.session);
    else { renderLogin('Đã đặt mật khẩu mới — đăng nhập lại nhé. 新密码已设置，请重新登录。'); }
  } catch (e) { renderResetPw(errMsg(e), true); }
}
async function doLogin(f) {
  const email = f.email.value.trim().toLowerCase(), password = f.password.value;
  LOGIN_EMAIL = email;
  const b = document.getElementById('login-btn'); b.disabled = true;
  try {
    const r = await sb.auth.signInWithPassword({ email, password }); if (r.error) throw r.error;
  } catch (e) {
    const m = String(e.message || e);
    renderLogin(/Invalid login/i.test(m) ? 'Sai email hoặc mật khẩu. 邮箱或密码错误。' : /confirm/i.test(m) ? 'Email chưa được xác nhận. 邮箱未确认。' : m, true);
  }
}
async function afterLogin(session) {
  S.session = session;
  document.getElementById('root').innerHTML = '<div class="loading">Đang tải dữ liệu… 数据加载中…</div>';
  try {
    const r = await sb.rpc('toi_la_ai'); if (r.error) throw r.error;
    S.me = r.data && r.data[0];
    if (!S.me) { renderNoAccess(session.user.email); return; }
    try { if (!localStorage.getItem('dd_lang') && S.me.ngon_ngu) LANG = S.me.ngon_ngu; } catch (e) { LANG = S.me.ngon_ngu || 'vi'; }
    await loadCatalogs(); renderShell(); await loadData(); renderMain(); renderNavCounts(); startRealtime();
    toast('Chào mừng ' + S.me.ho_ten + '!', false);
  } catch (e) { document.getElementById('root').innerHTML = '<div class="login"><div class="login-card"><div class="msg err">' + esc(errMsg(e)) + '</div><button class="btn" onclick="location.reload()">Thử lại 重试</button></div></div>'; }
}
function renderNoAccess(email) {
  document.getElementById('root').innerHTML = '<div class="login"><div class="login-card"><h1>Chưa được cấp quyền</h1><p class="muted" style="margin:0">Tài khoản <b>' + esc(email) + '</b> chưa được phân quyền truy cập dữ liệu.</p><p class="muted" style="margin:6px 0 0">Hãy nhờ Quản lý (Admin) thêm email này vào <b>Danh mục → Nhân viên</b>. Sau khi Admin thêm xong, hãy tải lại trang.</p><p class="muted" style="margin:12px 0 0">账号 <b>' + esc(email) + '</b> 尚未获得访问权限。请联系管理员在“基础资料 → 员工”中添加该邮箱，添加后刷新页面即可使用。</p><div style="display:flex;gap:16px;margin-top:16px"><button class="btn btn-pri" onclick="location.reload()">Tải lại 刷新</button><button class="btn" data-act="signout">Đăng xuất 退出</button></div></div></div>';
}
(async function init() {
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { RECOVERY = true; renderResetPw(); return; }
    if (RECOVERY) return;                       // đang đặt lại mật khẩu thì chưa cho vào app
    if (ev === 'SIGNED_IN' && !S.session && session) afterLogin(session);
    if (ev === 'SIGNED_OUT') { S.session = null; renderLogin(); }
  });
  const h = location.hash || '';
  if (/error_description=/.test(h)) {          // link hết hạn hoặc đã dùng rồi
    const m = decodeURIComponent((h.match(/error_description=([^&]*)/) || [])[1] || '').replace(/\+/g, ' ');
    RECOVERY = false;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    renderLogin('Link không dùng được nữa (hết hạn hoặc đã dùng) — bấm “Quên mật khẩu?” để xin link mới. ' + m, true);
    return;
  }
  const { data } = await sb.auth.getSession();
  if (RECOVERY) { renderResetPw(); return; }
  if (data.session) afterLogin(data.session); else renderLogin();
})();
</script>
