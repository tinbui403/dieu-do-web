<!doctype html>
<!-- FILE TẠO TỰ ĐỘNG từ src/app.src.html bằng build.py — đừng sửa trực tiếp file này. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B47E0">
<title>Điều độ · Đại Cát Lâm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235B47E0'/%3E%3Cpath d='M4 15h9V8H4zM13 10.5h3l2.5 2.5v2H13z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Ccircle cx='7' cy='17' r='1.6' fill='white'/%3E%3Ccircle cx='16' cy='17' r='1.6' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  /* ─── Nền & bề mặt (kính sáng, tông tím – chàm) ─── */
  --bg:#F4F2FB;
  --surface:rgba(255,255,255,.8);
  --ink:#1C1A33;--muted:#605E7C;--faint:#9C9AB8;
  --line:rgba(112,96,190,.18);--line2:rgba(112,96,190,.1);
  --soft:rgba(255,255,255,.62);--soft2:rgba(255,255,255,.4);
  /* ─── Màu nhấn tím – chàm ─── */
  --pri:#6D5AE6;--pri-ink:#4F3FCF;--pri-soft:#EAE6FF;
  --pri-grad:linear-gradient(135deg,#8B7BFF 0%,#6D5AE6 55%,#5B47E0 100%);
  /* ─── Sidebar sáng ─── */
  --side:#5B47E0;--side-ink:#3D3A5C;
  --side-h:#9C9AB8;--side-sub:#7A789A;
  /* ─── Trạng thái ─── */
  --red:#DC2626;--red-bg:rgba(220,38,38,.1);--red-ink:#B91C1C;
  --amb:#D97706;--amb-bg:rgba(217,119,6,.1);--amb-ink:#92400E;
  --teal:#059669;--teal-bg:rgba(5,150,105,.1);--teal-ink:#065F46;--green-ink:#14532D;
  --lav:rgba(109,90,230,.1);--lav-ink:#4F3FCF;--zalo:#0068FF;
  /* ─── Kính, bóng, bo góc ─── */
  --glass-line:rgba(255,255,255,.9);
  --tint:rgba(109,90,230,.06);--tint2:rgba(109,90,230,.1);
  --sh-card:0 10px 30px rgba(76,58,170,.08),0 1px 2px rgba(76,58,170,.05);
  --sh-card-h:0 18px 40px rgba(76,58,170,.14),0 2px 4px rgba(76,58,170,.06);
  --r-card:18px;
  --frame:clamp(10px,1.4vw,20px);
  --font:'Be Vietnam Pro','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(160deg,#F8F6FD 0%,#F2EFFA 55%,#EEF0FB 100%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--font);font-size:14px;
  line-height:1.45;-webkit-text-size-adjust:100%
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:var(--pri-ink)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.mono{font-family:var(--mono);font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#root{position:relative;z-index:1}
.main,.side,.drawer{scrollbar-width:thin;scrollbar-color:rgba(109,90,230,.28) transparent}
.main::-webkit-scrollbar,.side::-webkit-scrollbar,.drawer::-webkit-scrollbar{width:8px;height:8px}
.main::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb,.drawer::-webkit-scrollbar-thumb{background:rgba(109,90,230,.28);border-radius:8px}
.main::-webkit-scrollbar-track,.side::-webkit-scrollbar-track,.drawer::-webkit-scrollbar-track{background:transparent}

/* ─── Lớp nền 3D: khối màu, quả cầu, cont / tàu / cẩu trôi chậm sau khung kính ─── */
.bg3d{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg3d i{position:absolute;display:block;border-radius:50%;will-change:transform}
.bg3d .b1{width:60vmax;height:60vmax;right:-24vmax;top:-28vmax;
  background:radial-gradient(circle at 42% 42%,rgba(190,110,255,.95) 0%,rgba(130,62,240,.9) 36%,rgba(124,58,237,0) 66%);
  animation:drift1 34s ease-in-out infinite alternate}
.bg3d .b2{width:66vmax;height:66vmax;left:-32vmax;bottom:-36vmax;
  background:radial-gradient(circle at 58% 42%,rgba(226,84,240,.9) 0%,rgba(140,62,255,.88) 38%,rgba(140,62,255,0) 66%);
  animation:drift2 42s ease-in-out infinite alternate}
.bg3d .b3{width:24vmax;height:24vmax;left:5vmax;top:7vmax;
  background:radial-gradient(circle,rgba(170,130,255,0) 50%,rgba(170,130,255,.55) 55%,rgba(170,130,255,0) 70%);
  animation:drift3 28s ease-in-out infinite alternate}
.bg3d .b4{width:30vmax;height:30vmax;right:14vmax;bottom:-14vmax;
  background:radial-gradient(circle at 50% 50%,rgba(255,150,200,.6) 0%,rgba(255,150,200,0) 65%);
  animation:drift3 36s ease-in-out infinite alternate-reverse}
.bg3d .sph{width:15vmax;height:15vmax;right:-2vmax;top:36vh;
  background:radial-gradient(circle at 33% 30%,#FFF3C4 0%,#FFD166 26%,#FFA23A 60%,#E4711D 100%);
  box-shadow:0 34px 70px rgba(228,113,29,.38),inset -22px -28px 48px rgba(170,60,10,.28);
  animation:bob 14s ease-in-out infinite alternate}
.bg3d svg{position:absolute;display:block;will-change:transform}
.bg3d .sh-cont{width:22vmax;right:7vmax;bottom:2vmax;opacity:.62;animation:bob 18s ease-in-out infinite alternate-reverse}
.bg3d .sh-ship{width:48vmax;left:-6vmax;bottom:-1vmax;opacity:.5;animation:sail 46s ease-in-out infinite alternate}
.bg3d .sh-crane{width:20vmax;left:22vmax;top:3vmax;opacity:.55;transform-origin:50% 100%;animation:sway 22s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-6vmax,5vmax,0) scale(1.08)}}
@keyframes drift2{from{transform:translate3d(0,0,0) scale(1.05)}to{transform:translate3d(6vmax,-5vmax,0) scale(1)}}
@keyframes drift3{from{transform:translate3d(0,0,0)}to{transform:translate3d(3vmax,4vmax,0)}}
@keyframes bob{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-2.6vmax,0)}}
@keyframes sail{from{transform:translate3d(0,0,0)}to{transform:translate3d(5vmax,-.6vmax,0)}}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
html.lite .bg3d *{animation:none!important}  /* máy yếu (≤2 nhân / ≤2GB): nền đứng yên cho nhẹ */
@media (prefers-reduced-motion:reduce){
  .bg3d *,.content.swap,.drawer-wrap.in,.drawer-wrap.in .drawer{animation:none!important}
  .card,.gy-card,.btn,.nav-i,.chip{transition:none!important}
  .card:hover,.gy-card:hover,.btn:hover{transform:none!important}
}

/* ─── Khung kính nổi (3D) ─── */
.app{
  position:fixed;inset:var(--frame);z-index:1;
  display:flex;border-radius:26px;overflow:hidden
}
.app.app-in{animation:fadeUp .35s ease-out}
.app::before{
  content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,.62) 60%,rgba(255,255,255,.7) 100%);
  backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);
  border:1px solid var(--glass-line);
  box-shadow:0 34px 90px rgba(60,40,140,.24),0 2px 6px rgba(60,40,140,.08),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.5)
}
.side{
  position:relative;width:236px;flex-shrink:0;min-height:0;
  background:rgba(255,255,255,.28);
  border-right:1px solid rgba(255,255,255,.75);
  box-shadow:inset -1px 0 0 rgba(112,96,190,.06);
  color:var(--ink);display:flex;flex-direction:column;gap:18px;
  padding:20px 14px;overflow-y:auto;overflow-x:hidden
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-logo{
  width:38px;height:38px;border-radius:12px;
  background:var(--pri-grad);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 6px 14px rgba(91,71,224,.35),inset 0 1px 0 rgba(255,255,255,.4)
}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.brand-sub{font-size:12px;color:var(--side-sub)}
.nav-h{padding:0 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-h)}
.nav-g{display:flex;flex-direction:column;gap:3px}
.nav-i{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:40px;
  padding:0 10px;border:0;border-radius:12px;
  background:transparent;color:var(--side-ink);font-size:14px;font-weight:500;text-align:left;
  transition:background .18s,color .18s
}
.nav-i:hover{background:var(--tint);color:var(--pri-ink)}
.nav-i[aria-current="page"]{
  background:var(--tint2);color:var(--pri-ink);font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(109,90,230,.12),0 4px 12px rgba(91,71,224,.1)
}
.nav-i[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--pri-grad)}
.nav-i .cnt{
  margin-left:auto;min-width:24px;padding:1px 7px;
  border-radius:999px;font-size:12px;font-weight:600;text-align:center;
  background:rgba(109,90,230,.12);color:var(--pri-ink)
}
.nav-i[aria-current="page"] .cnt{background:var(--pri);color:#fff}
.langs{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(109,90,230,.08)}
.langs button{flex:1;min-height:34px;border:0;border-radius:9px;background:transparent;color:var(--side-ink);font-size:13px;font-weight:600}
.langs button[aria-pressed="true"]{background:#fff;color:var(--pri-ink);box-shadow:0 2px 6px rgba(76,58,170,.14)}
.me{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--line2)}
.avatar{
  width:34px;height:34px;border-radius:999px;
  background:var(--pri-grad);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;flex-shrink:0;box-shadow:0 4px 12px rgba(91,71,224,.35)
}
.me .out{border:0;background:transparent;color:var(--side-sub);font-size:12px;text-decoration:underline;padding:4px 6px;white-space:nowrap}
.me .out:hover{color:var(--pri-ink)}
.th-sort{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;white-space:nowrap}
.th-sort.on{color:var(--pri-ink)}
.th-sort:hover{text-decoration:underline}
.me-acts{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end}
.pw-row{position:relative}
.pw-row input{padding-right:78px!important}
.pw-eye{position:absolute;right:4px;top:4px;bottom:4px;border:0;border-radius:6px;background:var(--soft);color:var(--pri-ink);font-size:12px;font-weight:600;padding:0 10px}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.top{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(18px) saturate(1.6);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);
  border-bottom:1px solid rgba(255,255,255,.8);
  display:flex;align-items:center;gap:14px;padding:12px 28px;min-height:70px;
  box-shadow:0 4px 20px rgba(76,58,170,.05)
}
.top h1{margin:0;font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.menu-btn{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.6);align-items:center;justify-content:center}
.search{position:relative;width:300px}
.search svg{position:absolute;left:12px;top:12px}
.search input{
  width:100%;height:40px;padding:0 12px 0 36px;border-radius:12px;
  border:1px solid rgba(112,96,190,.16);
  background:rgba(255,255,255,.7);
  box-shadow:inset 0 1px 2px rgba(76,58,170,.04);
  transition:border-color .15s,box-shadow .15s
}
.search input:focus{border-color:rgba(109,90,230,.5);box-shadow:0 0 0 3px rgba(109,90,230,.14);outline:0}
.content{padding:22px 28px 60px}
.content.swap{animation:fadeUp .26s ease-out}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:99px;background:#9C9AB8;display:inline-block}
.live.on i{background:#10B981;box-shadow:0 0 6px rgba(16,185,129,.55)}
.bottom-nav{display:none}
.scrim{display:none}

/* ─── Controls ─── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:40px;padding:0 16px;border-radius:12px;
  border:1px solid rgba(112,96,190,.18);
  background:rgba(255,255,255,.74);
  color:var(--pri-ink);font-weight:600;font-size:14px;white-space:nowrap;
  text-decoration:none;box-shadow:0 1px 2px rgba(76,58,170,.06);
  transition:transform .15s,box-shadow .15s,background .15s,border-color .15s
}
.btn:hover{background:#fff;border-color:rgba(112,96,190,.32);transform:translateY(-1px);box-shadow:0 6px 14px rgba(76,58,170,.12)}
.btn:active{transform:translateY(0);box-shadow:0 1px 2px rgba(76,58,170,.08)}
.btn:disabled:hover{transform:none;box-shadow:0 1px 2px rgba(76,58,170,.06)}
.btn-pri{
  background:var(--pri-grad);
  border-color:transparent;color:#fff;
  box-shadow:0 6px 16px rgba(91,71,224,.35),inset 0 1px 0 rgba(255,255,255,.35)
}
.btn-pri:hover{background:linear-gradient(135deg,#7E6CFF 0%,#5F4BE0 55%,#4F3FCF 100%);border-color:transparent;box-shadow:0 10px 22px rgba(91,71,224,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-sm{min-height:34px;padding:0 11px;font-size:12px;border-radius:10px}
.btn-ok{background:rgba(5,150,105,.1);border-color:rgba(5,150,105,.35);color:var(--teal-ink)}
.btn-zalo{background:var(--zalo);border-color:var(--zalo);color:#fff}
.btn-line{border-color:var(--pri);color:var(--pri-ink)}
.btn-danger{border-color:rgba(220,38,38,.35);color:var(--red-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{
  min-height:36px;padding:0 14px;border-radius:999px;
  border:1px solid rgba(112,96,190,.18);
  background:rgba(255,255,255,.7);
  color:var(--ink);font-size:13px;font-weight:600;
  transition:background .15s,box-shadow .15s,transform .15s
}
.chip:hover{background:#fff;transform:translateY(-1px);box-shadow:0 4px 10px rgba(76,58,170,.1)}
.chip[aria-pressed="true"]{background:var(--pri-grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(91,71,224,.35)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pri-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-size:12px;font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--pri)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{
  height:40px;padding:0 10px;border-radius:10px;
  border:1px solid rgba(112,96,190,.18);
  background:rgba(255,255,255,.78);
  font-size:14px;font-weight:400;color:var(--ink);width:100%;
  transition:border-color .15s,box-shadow .15s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(109,90,230,.55);box-shadow:0 0 0 3px rgba(109,90,230,.14);outline:0}
.field textarea{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--soft);color:var(--muted)}
.field.chkf{flex-direction:row;align-items:center;gap:8px;min-height:40px}
.field.chkf input{width:18px;height:18px;accent-color:var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}

/* ─── Cards & Tables ─── */
.stack{display:flex;flex-direction:column;gap:18px}
.card{
  background:rgba(255,255,255,.8);
  border:1px solid var(--glass-line);
  border-radius:var(--r-card);padding:18px 20px;
  box-shadow:var(--sh-card);
  transition:transform .2s ease,box-shadow .2s ease
}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-card-h)}
.card h2{margin:0;font-size:15px;font-weight:700}
.band{display:flex;align-items:center;gap:12px}
.band span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
.band i{flex:1;height:1px;background:var(--line2)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
.tile{display:flex;flex-direction:column;gap:10px}
.tile .lab{font-size:13px;font-weight:600;color:var(--muted)}
.tile .val{font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.tile .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--faint)}
.tag{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.tbl{
  background:rgba(255,255,255,.8);
  border:1px solid var(--glass-line);
  border-radius:var(--r-card);overflow:hidden;
  box-shadow:var(--sh-card)
}
.tbl-x{overflow-x:auto}
.tbl-h{
  display:flex;align-items:center;gap:10px;padding:12px 18px;
  background:var(--tint);
  border-bottom:1px solid var(--line2);flex-wrap:wrap
}
.tbl-h h2{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.tr{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:0 18px;min-height:44px;border-bottom:1px solid rgba(112,96,190,.09);min-width:var(--minw,0);transition:background .12s}
.tr:last-child{border-bottom:0}
.tr.th{min-height:36px;font-size:12px;font-weight:600;color:var(--muted);background:rgba(109,90,230,.045)}
.tr:not(.th):hover{background:var(--tint)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk{background:none;border:0;padding:0;color:var(--pri-ink);text-align:left;font-size:13px}
.lk:hover{text-decoration:underline}
.lk.mono{font-size:13px}
.cnt-b{padding:1px 9px;border-radius:999px;background:var(--pri-soft);color:var(--pri-ink);font-size:12px;font-weight:700}
.empty{
  padding:40px 20px;text-align:center;
  background:rgba(255,255,255,.5);
  border:1px dashed rgba(112,96,190,.32);
  border-radius:var(--r-card);color:var(--muted)
}
.bar-bg{height:10px;border-radius:5px;background:rgba(112,96,190,.14)}
.bar{height:10px;border-radius:5px}
.heat-row{display:grid;grid-template-columns:190px repeat(14,minmax(0,1fr)) 36px;gap:4px;align-items:center}
.heat-c{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.legend-i{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 8px;border:0;border-radius:8px;background:transparent;width:100%;text-align:left;font-size:13px}
.legend-i:hover{background:var(--tint)}
.todo-i{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:10px;background:transparent;width:100%;text-align:left;font-size:13px;transition:background .12s}
.todo-i:hover{background:var(--tint)}
.todo-i b{min-width:32px;padding:2px 8px;border-radius:6px;background:var(--lav);color:var(--pri-ink);text-align:center}

/* ─── Suggestions ─── */
.gy-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
.gy-card{
  display:flex;align-items:stretch;
  background:rgba(255,255,255,.78);
  border:1px solid var(--glass-line);
  border-radius:16px;box-shadow:var(--sh-card);
  transition:transform .2s ease,box-shadow .2s ease
}
.gy-card:hover{transform:translateY(-2px);box-shadow:var(--sh-card-h)}
.gy-card.sel{
  border:2px solid var(--pri);
  box-shadow:0 10px 28px rgba(109,90,230,.22)
}
.gy-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:12px 16px;border:0;background:transparent;text-align:left}
.gy-side{
  display:flex;flex-direction:column;justify-content:center;gap:6px;
  padding:10px 14px;background:var(--tint);
  border-radius:0 14px 14px 0;min-width:140px
}
.panel{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.order{
  margin:0;white-space:pre-wrap;font-family:var(--mono),'Noto Sans SC',monospace;
  font-size:12px;line-height:1.6;
  background:var(--tint);
  border:1px solid rgba(112,96,190,.16);border-radius:12px;padding:12px
}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}

/* ─── Drawer / Modal ─── */
.drawer-wrap{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(40,30,90,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.drawer-wrap.in{animation:scrimIn .2s ease-out}
.drawer-wrap>.close-area{flex:1;border:0;background:transparent}
.drawer{
  width:560px;max-width:100%;height:100%;overflow-y:auto;
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:-16px 0 50px rgba(50,35,120,.25);display:flex;flex-direction:column
}
.drawer-wrap.in .drawer{animation:drawerIn .24s ease-out}
.drawer-h{
  position:sticky;top:0;z-index:2;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line2);padding:16px 20px;display:flex;align-items:flex-start;gap:12px
}
.drawer-b{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.drawer-f{
  position:sticky;bottom:0;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line2);
  padding:12px 20px;display:flex;gap:10px;justify-content:flex-end
}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;line-height:1.3;color:var(--muted)}
.step b{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:99px;font-size:12px;background:rgba(112,96,190,.12);color:var(--faint)}
.step.done b{background:var(--pri-soft);color:var(--pri-ink)}
.step.cur b{background:var(--pri-grad);color:#fff;box-shadow:0 4px 10px rgba(91,71,224,.35)}
.step.cur{color:var(--ink);font-weight:600}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h3{margin:0;font-size:13px;font-weight:700;color:var(--pri-ink)}
.x-btn{
  width:40px;height:40px;border-radius:12px;
  border:1px solid rgba(112,96,190,.16);
  background:rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .15s,transform .15s
}
.x-btn:hover{background:#fff;transform:rotate(90deg)}

/* ─── Toast & Login ─── */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;
  padding:12px 18px;border-radius:12px;
  background:rgba(28,26,51,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:#fff;font-size:13px;font-weight:500;
  box-shadow:0 12px 36px rgba(28,26,51,.35);max-width:min(640px,calc(100vw - 32px));display:none
}
#toast.show{display:block;animation:fadeUp .2s ease-out}
#toast.err{background:var(--red)}
.login{
  position:relative;z-index:1;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px
}
.login-card{
  width:420px;max-width:100%;
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);
  border:1px solid var(--glass-line);
  border-radius:24px;padding:30px;
  box-shadow:0 34px 90px rgba(60,40,140,.24),0 2px 6px rgba(60,40,140,.08),inset 0 1px 0 rgba(255,255,255,.95);
  display:flex;flex-direction:column;gap:16px;
  animation:fadeUp .35s ease-out
}
.login-card h1{margin:0;font-size:22px;color:var(--ink)}
.tabs2{
  display:flex;gap:4px;padding:4px;border-radius:12px;
  background:rgba(109,90,230,.08)
}
.tabs2 button{flex:1;min-height:36px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{
  background:#fff;color:var(--pri-ink);
  box-shadow:0 2px 6px rgba(76,58,170,.14)
}
.msg{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--lav);color:var(--lav-ink)}
.msg.err{background:var(--red-bg);color:var(--red-ink)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

/* ─── Responsive ─── */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gy-layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
}
@media (max-width:900px){
  .app,.app.app-in{inset:0;border-radius:0;animation:none}
  .app::before{border:0;border-radius:0;box-shadow:none;background:rgba(255,255,255,.7)}
  .bg3d .sh-crane{display:none}
  .side{position:fixed;left:0;top:0;height:100vh;height:100dvh;z-index:50;transform:translateX(-100%);transition:transform .22s ease;visibility:hidden;
    background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--glass-line)}
  .app.nav-open .side{transform:none;visibility:visible;box-shadow:8px 0 32px rgba(50,35,120,.28)}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(40,30,90,.3);border:0;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .menu-btn{display:flex}
  .top{padding:10px 14px;min-height:60px;gap:10px}
  .top h1{font-size:18px}
  .top .sub,.top .search,.top .live{display:none}
  .content{padding:14px 14px 96px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .heat-row{grid-template-columns:110px repeat(14,minmax(0,1fr)) 28px}
  .gy-card{flex-direction:column}
  .gy-side{border-radius:0 0 14px 14px;flex-direction:row;align-items:center;justify-content:space-between}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card:hover,.gy-card:hover{transform:none}
  .bottom-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
    border-top:1px solid rgba(255,255,255,.9);
    box-shadow:0 -8px 30px rgba(60,40,140,.1);
    padding:4px 6px calc(8px + env(safe-area-inset-bottom))
  }
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;border:0;background:transparent;font-size:11px;font-weight:500;color:var(--muted)}
  .bottom-nav button[aria-current="page"]{color:var(--pri);font-weight:700}
  .bottom-nav .bdg{min-width:16px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;line-height:16px}
  #toast{bottom:84px}
  .top .btn span{display:none}
  .top .btn{padding:0 12px}
  .cards .tbl-x{overflow:visible}
  .cards .tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 14px;min-width:0!important}
  .cards .tr.th{display:none}
  .cards .tr>:empty{display:none}
  .cards .tr>:first-child{flex-basis:100%;font-size:15px}
  .cards .tr>.btn{margin-left:auto}
  .cards [data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px;font-weight:400}
}
@media (min-width:901px){
  .drawer{height:calc(100% - 24px);margin:12px 12px 12px 0;border-radius:22px;border:1px solid var(--glass-line)}
}
@media (max-width:560px){
  .g4{grid-template-columns:minmax(0,1fr)}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
}

<script>// Kiem Dich Wizard — PHASE 3: form INLINE 3 bước (chọn cont KD → nhập mã KDTV → xác nhận & lưu)
// Khác bản cũ: KHÔNG mở drawer nữa. Wizard render thẳng vào màn Kiểm dịch (vKD) qua S.kdWiz.
// Logic dữ liệu (chọn cont, cập nhật cont_kiem_dich, mã KDTV, tích da_kiem_dich, lưu Supabase) GIỮ NGUYÊN 100%.
const KD_WIZARD = {
  step: 1,
  lo: null,
  contId: null,
  maKdtv: '',

  // Mở wizard inline cho một lô: chuyển sang tab Kiểm dịch và render form ngay trong trang
  open: function(loId) {
    const l = S.lots[loId];
    if (!l) { toast(T1('Không tìm thấy lô ' + loId, '找不到批次 ' + loId), true); return; }
    this.step = 1;
    this.lo = loId;
    const existing = S.conts.find(c => c.lo === loId && c.cont_kiem_dich && c.trang_thai !== '9');
    this.contId = existing ? existing.id : null;
    this.maKdtv = l.ma_don_kdtv || '';
    S.kdWiz = loId;
    // Nếu đang mở một drawer (vd chi tiết lô) thì đóng lại — wizard giờ hiển thị inline
    if (S.drawer) { S.drawer = null; const d = document.getElementById('drawer'); if (d) d.innerHTML = ''; }
    if (S.tab !== 'kd') { S.tab = 'kd'; renderShell(); } else { renderMain(); }
    this._afterPaint(true);
  },

  // Đóng wizard inline
  close: function() {
    S.kdWiz = null;
    if (S.drawer) { S.drawer = null; const d = document.getElementById('drawer'); if (d) d.innerHTML = ''; }
    renderMain();
  },

  selectCont: function(id) {
    this.contId = id;
    this.paint();
  },

  _readMa: function() {
    const el = document.getElementById('kd-wizard-ma');
    if (el) this.maKdtv = el.value.trim();
  },

  nextStep: function() {
    if (this.step === 1) {
      if (!this.contId) { toast(T1('Vui lòng chọn cont kiểm dịch.', '请先选择检疫柜。'), true); return; }
      this.step = 2;
    } else if (this.step === 2) {
      this._readMa();
      if (!this.maKdtv) { toast(T1('Vui lòng nhập mã KDTV.', '请输入检疫单号。'), true); return; }
      this.step = 3;
    }
    this.paint();
  },

  prevStep: function() {
    if (this.step === 2) { this._readMa(); this.step = 1; this.paint(); }
    else if (this.step === 3) { this.step = 2; this.paint(); }
  },

  save: async function() {
    this._readMa();
    const l = S.lots[this.lo];
    const cont = S.conts.find(c => c.id === this.contId);
    if (!l || !cont || !this.maKdtv) return;
    const tickEl = document.getElementById('kd-wizard-tick');
    const tickKd = tickEl && tickEl.checked;
    const btn = document.getElementById('kd-wizard-save-btn');
    if (btn) btn.disabled = true;
    try {
      // Bỏ đánh dấu KD các cont cũ trong lô (nếu khác cont đang chọn)
      const oldKd = S.conts.filter(c => c.lo === this.lo && c.cont_kiem_dich && c.id !== this.contId && c.trang_thai !== '9');
      for (const c of oldKd) {
        await q(sb.from('cont').update({ cont_kiem_dich: false }).eq('id', c.id));
      }
      // Đánh dấu cont được chọn là cont KD
      await q(sb.from('cont').update({ cont_kiem_dich: true }).eq('id', this.contId));
      // Cập nhật mã KDTV (và tích KD nếu đủ điều kiện)
      const loPatch = { ma_don_kdtv: this.maKdtv };
      if (tickKd) loPatch.da_kiem_dich = true;
      await q(sb.from('lo').update(loPatch).eq('lo', this.lo));

      toast(T1('Đã lưu kiểm dịch lô ' + this.lo, '已保存检疫信息 ' + this.lo));
      S.kdWiz = null;                    // đóng wizard, ở lại màn Kiểm dịch
      await loadData();
      renderMain();
      renderNavCounts();
    } catch (e) {
      if (btn) btn.disabled = false;
      toast(errMsg(e), true);
    }
  },

  // Re-render toàn màn (vKD sẽ nhúng bodyHTML) rồi focus/scroll hợp lý
  paint: function() {
    renderMain();
    this._afterPaint(false);
  },

  _afterPaint: function(scroll) {
    const self = this;
    requestAnimationFrame(function() {
      if (self.step === 2) {
        const ma = document.getElementById('kd-wizard-ma');
        if (ma) { ma.focus(); ma.select(); }
      }
      if (scroll) {
        const w = document.getElementById('kd-wiz-panel');
        if (w && w.scrollIntoView) w.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  },

  // Trả về HTML của panel wizard inline (được vKD() nhúng vào đầu trang khi S.kdWiz được đặt)
  bodyHTML: function() {
    const l = S.lots[this.lo];
    if (!l) return '';
    const conts = S.conts.filter(c => c.lo === this.lo && c.trang_thai !== '9')
      .sort((a, b) => +a.trang_thai - +b.trang_thai);
    const selCont = conts.find(c => c.id === this.contId);
    const readyKd = selCont && selCont.trang_thai === '4' && BAI_KD.indexOf(selCont.bai_tam) > -1;
    const canTickNow = readyKd && this.maKdtv;

    // --- Thanh bước ---
    const stepLabels = [T1('Chọn cont', '选柜'), T1('Mã KDTV', '检疫单号'), T1('Xác nhận', '确认')];
    const stepBar = '<div style="display:flex;gap:6px;margin-bottom:18px">' +
      stepLabels.map((s, i) => '<div style="flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:12px;font-weight:600;' +
        (i + 1 === this.step ? 'background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.35)' :
         i + 1 < this.step ? 'background:var(--teal-bg);color:var(--teal-ink)' :
         'background:var(--soft);color:var(--faint)') + '">' +
        (i + 1 < this.step ? '✓ ' : (i + 1 === this.step ? '' : (i + 1) + '. ')) + esc(s) + '</div>').join('') + '</div>';

    // --- Nội dung theo bước ---
    let body = '';
    if (this.step === 1) {
      body = '<p style="margin:0 0 12px;font-size:13px;color:var(--muted)">' +
        esc(T1('Chọn cont sẽ đi kiểm dịch. Ưu tiên cont đang ở bãi HLS / PD / HT (đã sẵn sàng).', '请选择检疫柜，优先选已在HLS/PD/HT堆场的柜子。')) + '</p>' +
        (conts.length ? conts.map(c => {
          const isSel = c.id === this.contId;
          const atKdBai = c.trang_thai === '4' && BAI_KD.indexOf(c.bai_tam) > -1;
          const atOtherBai = c.trang_thai === '4' && !atKdBai;
          const bg = isSel ? 'var(--pri)' : atKdBai ? 'var(--teal-bg)' : 'var(--soft)';
          const fg = isSel ? '#fff' : 'var(--ink)';
          const border = isSel ? '2px solid var(--pri)' : atKdBai ? '2px solid #7FC8BF' : '1px solid var(--line)';
          const badge = atKdBai ? pill(T1('Sẵn sàng KD', '可检疫'), 'var(--teal-bg)', 'var(--teal-ink)') :
                        atOtherBai ? pill('Bãi ' + (c.bai_tam || '?'), 'var(--amb-bg)', 'var(--amb-ink)') :
                        stPill(c.trang_thai);
          return '<button type="button" data-act="kd-wizard-sel" data-id="' + esc(c.id) + '" ' +
            'style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:' + border + ';background:' + bg + ';color:' + fg + ';border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer">' +
            '<div style="flex:1;min-width:0">' +
              '<div class="mono" style="font-size:15px;font-weight:700">' + esc(c.so_cont || c.ma_don || T1('Chưa có số', '未填柜号')) + '</div>' +
              '<div style="font-size:12px;margin-top:2px;opacity:' + (isSel ? '.85' : '1') + '">' +
                esc(c.kho ? c.kho : '') + (c.bai_tam ? (c.kho ? ' → ' : '') + 'Bãi ' + c.bai_tam : '') +
                (c.nha_xe ? ' · ' + c.nha_xe : '') +
              '</div>' +
            '</div>' +
            '<div>' + badge + '</div>' +
            (isSel ? '<div style="font-size:18px">✓</div>' : '') +
            '</button>';
        }).join('') : '<p class="muted">' + esc(T1('Lô chưa có cont.', '此批次暂无柜子。')) + '</p>');

    } else if (this.step === 2) {
      body =
        '<div style="background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:16px">' +
          '<div class="muted" style="font-size:11px;margin-bottom:3px">' + esc(T1('Cont kiểm dịch', '检疫柜')) + '</div>' +
          '<div class="mono" style="font-size:17px;font-weight:700">' + esc(selCont ? (selCont.so_cont || selCont.ma_don || '—') : '—') + '</div>' +
          '<div class="muted" style="font-size:12px">' + esc(selCont ? stLabel(selCont.trang_thai) + (selCont.bai_tam ? ' · Bãi ' + selCont.bai_tam : '') : '') + '</div>' +
        '</div>' +
        '<label class="field" style="display:block">' +
          '<span style="font-weight:600">' + esc(T('kdtv')) + '</span> <span style="color:var(--red-ink)">*</span><br>' +
          '<input id="kd-wizard-ma" type="text" value="' + esc(this.maKdtv) + '" ' +
            'placeholder="VD: 11300/HAN-KD/24/05..." ' +
            'autocapitalize="characters" ' +
            'style="font-family:var(--mono);font-size:15px;letter-spacing:.03em;margin-top:6px" required>' +
        '</label>' +
        '<p class="muted" style="font-size:12px;margin-top:8px">' +
          esc(T1('Mã trên tờ kiểm dịch tiêu vật của lô. Sẽ được lưu vào lô.', '检疫单号，来自检疫证书。')) +
        '</p>';

    } else {
      const whyNoTick = !readyKd ?
        (selCont && selCont.trang_thai !== '4' ? T1('cont chưa về bãi', '柜未到堆场') :
         selCont && BAI_KD.indexOf(selCont.bai_tam) < 0 ? T1('bãi ' + (selCont.bai_tam || '?') + ' không được kiểm dịch (chỉ HLS / PD / HT)', '堆场不符') : '') : '';
      body =
        '<div class="kv" style="background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:16px">' +
          '<span>' + esc(T('loCol')) + '</span><span style="font-weight:700">' + esc(this.lo) + (l.booking ? ' · ' + l.booking : '') + '</span>' +
          '<span>' + esc(T('kdCont')) + '</span><span class="mono" style="font-weight:700">' + esc(selCont ? (selCont.so_cont || selCont.ma_don || '—') : '—') + '</span>' +
          '<span>' + esc(T('kdtv')) + '</span><span class="mono">' + esc(this.maKdtv) + '</span>' +
          '<span>' + esc(T1('Trạng thái cont', '柜状态')) + '</span><span>' + (selCont ? esc(stLabel(selCont.trang_thai) + (selCont.bai_tam ? ' · Bãi ' + selCont.bai_tam : '')) : '—') + '</span>' +
        '</div>' +
        (canTickNow ?
          '<label class="chk" style="margin-bottom:14px;padding:10px 12px;background:var(--teal-bg);border-radius:12px">' +
            '<input id="kd-wizard-tick" type="checkbox" checked>' +
            '<span>' + esc(T1('Tích "Lô đã kiểm dịch" ngay — cont đang ở bãi ' + (selCont.bai_tam || '') + ', đủ điều kiện.', '立即勾选已检疫—柜已在合规堆场。')) + '</span>' +
          '</label>' :
          (whyNoTick ? '<div style="font-size:12px;color:var(--muted);padding:8px 12px;background:var(--amb-bg);border-radius:10px;margin-bottom:14px">ℹ ' +
            esc(T1('Chưa thể tích KD ngay vì ' + whyNoTick + '. Bấm Lưu rồi tích thủ công sau khi cont về đúng bãi.', '暂不能勾选KD：' + whyNoTick + '。保存后待柜到位再手动勾选。')) +
            '</div>' : '')) +
        '<button id="kd-wizard-save-btn" type="button" class="btn btn-pri" data-act="kd-wizard-save" style="width:100%;min-height:46px;font-size:15px">' +
          esc(T1('💾 Lưu kiểm dịch', '保存检疫信息')) +
        '</button>';
    }

    // --- Điều hướng bước ---
    const footer = '<div style="display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">' +
      (this.step > 1 ?
        '<button type="button" class="btn" data-act="kd-prev-step" style="flex:1">← ' + esc(T1('Quay lại', '返回')) + '</button>' :

  return Object.keys(g).map(k => ({ l:S.lots[k] || { lo:k }, cs:g[k] }))

const LO_SORTS = [['closing', ['Closing gần nhất', '截关时间']], ['thu_tu', ['Thứ tự tự đặt', '自定顺序']], ['lo', ['Số lô', '批次号']], ['etd', ['ETD', 'ETD']], ['booking', ['Booking', '订舱号']], ['khach_hang', ['Khách hàng', '客户']], ['hang_tau', ['Hãng tàu', '船公司']], ['so_luong', ['Số lượng cont', '柜数']], ['moi', ['Mới cập nhật', '最近更新']]];
function loKey(l, k) {
  if (k === 'closing') return l.closing ? +new Date(l.closing) : null;
  if (k === 'etd') return l.etd || l.etd_kho || null;
  if (k === 'moi') return l.cap_nhat_luc ? +new Date(l.cap_nhat_luc) : null;
  if (k === 'so_luong') return l.so_luong_cont != null ? l.so_luong_cont : (l.so_cont || null);
  if (k === 'thu_tu') return l.thu_tu != null ? l.thu_tu : null;
  return l[k] == null || l[k] === '' ? null : l[k];
}
function sortLots(arr) {
  const k = LO_SORT.k, d = LO_SORT.d;
  return arr.sort((a, b) => {
    const x = loKey(a, k), y = loKey(b, k);
    if (x == null && y == null) return String(a.lo).localeCompare(String(b.lo), 'vi', { numeric:true });
    if (x == null) return 1; if (y == null) return -1;   // ô trống luôn nằm cuối
    const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'vi', { numeric:true });
    return (r || String(a.lo).localeCompare(String(b.lo), 'vi', { numeric:true })) * d;
  });
}

    else if ((/tàu|etd|chạy/.test(before) || TN_HANG.some(h => new RegExp('\\b' + h + '\\b').test(before + ' ' + after))) && !F.tau) type = 'tau';

    if (!type) continue;

      const pre = /((?:sáng|chiều|tối|trưa)\s*(?:(?:trước|sau|lúc)\s*\d{1,2}\s*h(?:\d{2})?)?\s*)$/i.exec(b.slice(Math.max(0, s0 - 24), s0)); if (pre) s0 -= pre[1].length;
      const post = /^(\s*(?:(?:sáng|chiều|tối)\s*)?(?:trước|sau|lúc)\s*\d{1,2}\s*h(?:\d{2})?)/i.exec(b.slice(e0)); if (post) e0 += post[1].length;
    }
    if (take(s0, e0)) F[type] = b.slice(s0, e0).replace(/\s+/g, ' ').trim();
  }
  TN_HANG.some(h => { const mm = new RegExp('\\b' + h + '\\b', 'i').exec(b); if (mm) { F.hang = mm[0].toUpperCase(); return true; } return false; });
  if (F.tau) F.tau = F.tau.replace(new RegExp('\\s*\\b(' + TN_HANG.join('|') + ')\\b\\s*', 'i'), ' ').trim();

  const kh = S.khachhang.map(x => x.ten).filter(t => t && nb.includes(khongDau(t))).sort((a, c) => c.length - a.length)[0]
    || (F.chuHang ? (S.khachhang.find(x => khongDau(x.ten).startsWith(khongDau(F.chuHang).split(' ')[0])) || {}).ten : null);
  const words = t => khongDau(t).split(/[^a-z0-9]+/).filter(w => w.length >= 3 && ['kho', 'dong', 'hang', 'ngoai', 'anh', 'chi'].indexOf(w) < 0);
  const khoWords = words((F.kho || '') + ' ' + (F.chuHang || '') + ' ' + (kh || ''));
  let khoBest = null, khoScore = 0;
  khoActive().forEach(k => { const hay = khongDau(k.ten + ' ' + (k.khu_vuc || '') + ' ' + (k.khach_hang_chinh || '')); const sc = khoWords.filter(w => hay.includes(w)).length + (F.kho && hay.includes(khongDau(F.kho)) ? 3 : 0); if (sc > khoScore) { khoScore = sc; khoBest = k.ten; } });
  const cang = F.noiDen ? S.cangden.find(c => [c.ten_vn, c.ma, c.ten_tq].some(x => x && khongDau(F.noiDen).includes(khongDau(x)))) : null;

}

function maDonGoc(m) { return String(m || '').replace(/-\d+$/, '').trim(); }
function maDonPrefix(kh) { const w = khongDau(kh || '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean); return w.length >= 2 ? w[0][0] + w[1][0] : (w[0] || '').slice(0, 2); }
// Mã đơn gợi ý: chữ tắt khách + tháng + số thứ tự đơn trong tháng (VD HX 09190) — anh Hi chốt 24/09
async function goiYMaDon(kh) {
  const p = maDonPrefix(kh); if (!p) return '';
  const mm = todayVN().slice(5, 7), re = new RegExp('^' + p + '\\s?' + mm + '(\\d{2,4})');
  let rows = [];
  try { const r = await q(sb.from('cont').select('ma_don').ilike('ma_don', p + '%' + mm + '%').order('ma_don', { ascending:false }).limit(300)); rows = r.data || []; }
  catch (e) { rows = S.conts.map(c => ({ ma_don:c.ma_don })); }
  let mx = 0; rows.forEach(r => { const m = re.exec(String(r.ma_don || '').toUpperCase().trim()); if (m) mx = Math.max(mx, +m[1]); });
  return p + ' ' + mm + String(mx + 1).padStart(3, '0');
}

/* ---------------- TÌM BOOKING cho đơn → tạo lô & gán cont ---------------- */
function donCua(c) { const g = maDonGoc(c.ma_don); return S.conts.filter(x => x.trang_thai === '1' && !x.lo && (g ? maDonGoc(x.ma_don) === g : x.id === c.id) && (x.khach_hang || '') === (c.khach_hang || '')); }
// Mã lô gợi ý: booking đã có lô → cùng số + chữ kế tiếp (604A → 604B); chưa có → số lớn nhất + 1
function goiYMaLo(bk) {
  const all = Object.values(S.lots).filter(l => !l.da_huy);
  const num = x => { const m = /^(\d+)([A-Z]?)$/i.exec(String(x || '').trim()); return m ? [+m[1], m[2].toUpperCase()] : null; };
  if (bk) {
    const ls = all.filter(l => l.so_booking === bk || l.booking === bk).map(l => num(l.lo)).filter(Boolean);
    if (ls.length) { const base = Math.max.apply(null, ls.map(x => x[0])); let mx = 'A'; ls.filter(x => x[0] === base).forEach(x => { const ch = x[1] || 'A'; if (ch > mx) mx = ch; }); return base + (mx === 'Z' ? 'Z2' : String.fromCharCode(mx.charCodeAt(0) + 1)); }
  }
  let mx = 0; all.forEach(l => { const x = num(l.lo); if (x) mx = Math.max(mx, x[0]); });
  return mx ? String(mx + 1) : '';
}

async function loadHistory(bang, khoa, boxId) {
  const box = document.getElementById(boxId); if (!box) return;
  box.innerHTML = '<div class="muted">…</div>';
  try {
    const r = await q(sb.from('nhat_ky').select('*').eq('bang', bang).eq('khoa', khoa).order('luc', { ascending:false }).limit(100));
    let rows = r.data || [];
    // Lô đã đổi mã: nối thêm lịch sử của mã cũ (dòng nhật ký "lo: cũ → mới" nằm dưới mã mới)
    if (bang === 'lo') {
      const seen = new Set([khoa]); let cur = rows;
      for (let i = 0; i < 5; i++) {
        const olds = cur.filter(x => x.thay_doi && Array.isArray(x.thay_doi.lo) && seen.has(x.thay_doi.lo[1])).map(x => x.thay_doi.lo[0]).filter(v => v && !seen.has(v));
        if (!olds.length) break;
        olds.forEach(v => seen.add(v));
        const r2 = await q(sb.from('nhat_ky').select('*').eq('bang', 'lo').in('khoa', olds).order('luc', { ascending:false }).limit(100));
        cur = r2.data || []; rows = rows.concat(cur);
      }
      rows.sort((a, b) => new Date(b.luc) - new Date(a.luc));
    }
    box.innerHTML = rows.length ? rows.map(x => nkLine(x)).join('') : '<div class="muted" style="font-size:13px">' + esc(T1('Chưa có thay đổi nào được ghi (dữ liệu nạp từ file cũ không có lịch sử).', '暂无记录（从旧文件导入的数据没有历史）。')) + '</div>';

function formObj(form) {
  const o = {};
  form.querySelectorAll('input[name],select[name],textarea[name]').forEach(el => {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'datetime-local') o[el.name] = inputToTs(el.value);
    else if (el.type === 'number') o[el.name] = el.value === '' ? null : Number(el.value);
    else { const v = el.value.trim(); o[el.name] = v === '' ? null : v; }
  });
  return o;
}

async function saveDm(form) {

  try {

      if (!nx || !kv) throw new Error(T('required'));
      const up = [], del = [];
      GIA_LOAI.forEach(x => { const v = o['g_' + x[0]]; if (v == null) del.push(x[0]); else up.push({ nha_xe:nx, khu_vuc:kv, loai:x[0], gia:v, ghi_chu:o.ghi_chu }); });

      if (del.length && key) await q(sb.from('bang_gia_xe').delete().eq('nha_xe', nx).eq('khu_vuc', kv).in('loai', del));
    } else {
      const tbl = { nhaxe:'nha_xe', kho:'kho', nv:'nhan_vien', bai:'bai_tam', cangden:'cang_den', cangha:'cang_ha' }[kind], pk = { nhaxe:'ma', kho:'ten', nv:'email', bai:'ma', cangden:'ma', cangha:'ten' }[kind];

      else { if (!o[pk]) throw new Error(T('required')); if (kind === 'nhaxe' || kind === 'bai') o[pk] = o[pk].toUpperCase(); await q(sb.from(tbl).insert(o)); }
    }
    toast(T('saved')); await loadCatalogs(); renderMain();
  } catch (e) { toast(errMsg(e), true); }
}

async function callNhanVienFn(action, payload) {
  const { data:sess } = await sb.auth.getSession();
  if (!sess || !sess.session) throw new Error(T1('Phiên đăng nhập đã hết, tải lại trang.', '登录已过期，请刷新页面。'));
  const r = await fetch(SUPABASE_URL + '/functions/v1/quan-ly-nhan-vien', {
    method:'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + sess.session.access_token, 'apikey':SUPABASE_KEY },
    body: JSON.stringify(Object.assign({ action }, payload))
  });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j.ok) throw new Error(j.error || ('Lỗi (' + r.status + ')'));
  return j;
}

    const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (r.error) throw r.error;
    renderLogin('Đã gửi mail đặt lại mật khẩu tới ' + email + '. Mở hộp thư, bấm link trong mail rồi đặt mật khẩu mới. 重置密码邮件已发送，请查收。');
  } catch (e) { renderLogin(errMsg(e), true); }
};
function renderResetPw(msg, isErr) {
  document.getElementById('root').innerHTML = '<div class="login"><form class="login-card" id="reset-form">' +
    '<div class="brand" style="padding:0"><div class="brand-logo" style="background:var(--side)">' + ico('truck', 22, '#fff') + '</div><div><div class="brand-name" style="color:var(--pri-ink)">Điều độ 调度</div><div class="muted" style="font-size:12px">Đặt mật khẩu mới 设置新密码</div></div></div>' +
    pwField('Mật khẩu mới 新密码', 'p1', 'new-password') +
    pwField('Nhập lại mật khẩu mới 再次输入', 'p2', 'new-password') +
    (msg ? '<div class="msg' + (isErr ? ' err' : '') + '">' + esc(msg) + '</div>' : '') +
    '<button class="btn btn-pri" type="submit" id="reset-btn" style="min-height:44px">Lưu mật khẩu 保存密码</button>' +
    '<p class="muted" style="margin:0;font-size:12px">Ít nhất 6 ký tự. Lưu xong là vào thẳng trang luôn. 至少6位，保存后直接进入。</p>' +
  '</form></div>';
  const i = document.querySelector('#reset-form [name=p1]'); if (i) i.focus();
}
async function doResetPw(f) {
  const p1 = f.p1.value, p2 = f.p2.value;
  if (p1.length < 6) { renderResetPw('Mật khẩu cần ít nhất 6 ký tự. 密码至少6位。', true); return; }
  if (p1 !== p2) { renderResetPw('Hai lần nhập không giống nhau. 两次输入不一致。', true); return; }
  const b = document.getElementById('reset-btn'); if (b) { b.disabled = true; b.textContent = 'Đang lưu… 保存中…'; }
  try {
    const r = await sb.auth.updateUser({ password: p1 }); if (r.error) throw r.error;
    RECOVERY = false;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    const { data } = await sb.auth.getSession();
    if (data.session) afterLogin(data.session);
    else { renderLogin('Đã đặt mật khẩu mới — đăng nhập lại nhé. 新密码已设置，请重新登录。'); }
  } catch (e) { renderResetPw(errMsg(e), true); }
}
async function doLogin(f) {
  const email = f.email.value.trim().toLowerCase(), password = f.password.value;
  LOGIN_EMAIL = email;
  const b = document.getElementById('login-btn'); b.disabled = true;
  try {
    const r = await sb.auth.signInWithPassword({ email, password }); if (r.error) throw r.error;
  } catch (e) {
    const m = String(e.message || e);
    renderLogin(/Invalid login/i.test(m) ? 'Sai email hoặc mật khẩu. 邮箱或密码错误。' : /confirm/i.test(m) ? 'Email chưa được xác nhận. 邮箱未确认。' : m, true);
  }
}
async function afterLogin(session) {
  S.session = session;
  document.getElementById('root').innerHTML = '<div class="loading">Đang tải dữ liệu… 数据加载中…</div>';
  try {
    const r = await sb.rpc('toi_la_ai'); if (r.error) throw r.error;
    S.me = r.data && r.data[0];
    if (!S.me) { renderNoAccess(session.user.email); return; }
    try { if (!localStorage.getItem('dd_lang') && S.me.ngon_ngu) LANG = S.me.ngon_ngu; } catch (e) { LANG = S.me.ngon_ngu || 'vi'; }
    await loadCatalogs(); renderShell(); await loadData(); renderMain(); renderNavCounts(); startRealtime();
    toast('Chào mừng ' + S.me.ho_ten + '!', false);
  } catch (e) { document.getElementById('root').innerHTML = '<div class="login"><div class="login-card"><div class="msg err">' + esc(errMsg(e)) + '</div><button class="btn" onclick="location.reload()">Thử lại 重试</button></div></div>'; }
}
function renderNoAccess(email) {
  document.getElementById('root').innerHTML = '<div class="login"><div class="login-card"><h1>Chưa được cấp quyền</h1><p class="muted" style="margin:0">Tài khoản <b>' + esc(email) + '</b> chưa được phân quyền truy cập dữ liệu.</p><p class="muted" style="margin:6px 0 0">Hãy nhờ Quản lý (Admin) thêm email này vào <b>Danh mục → Nhân viên</b>. Sau khi Admin thêm xong, hãy tải lại trang.</p><p class="muted" style="margin:12px 0 0">账号 <b>' + esc(email) + '</b> 尚未获得访问权限。请联系管理员在“基础资料 → 员工”中添加该邮箱，添加后刷新页面即可使用。</p><div style="display:flex;gap:16px;margin-top:16px"><button class="btn btn-pri" onclick="location.reload()">Tải lại 刷新</button><button class="btn" data-act="signout">Đăng xuất 退出</button></div></div></div>';
}
(async function init() {
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { RECOVERY = true; renderResetPw(); return; }
    if (RECOVERY) return;                       // đang đặt lại mật khẩu thì chưa cho vào app
    if (ev === 'SIGNED_IN' && !S.session && session) afterLogin(session);
    if (ev === 'SIGNED_OUT') { S.session = null; renderLogin(); }
  });
  const h = location.hash || '';
  if (/error_description=/.test(h)) {          // link hết hạn hoặc đã dùng rồi
    const m = decodeURIComponent((h.match(/error_description=([^&]*)/) || [])[1] || '').replace(/\+/g, ' ');
    RECOVERY = false;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    renderLogin('Link không dùng được nữa (hết hạn hoặc đã dùng) — bấm “Quên mật khẩu?” để xin link mới. ' + m, true);
    return;
  }
  const { data } = await sb.auth.getSession();
  if (RECOVERY) { renderResetPw(); return; }
  if (data.session) afterLogin(data.session); else renderLogin();
})();
</script>
