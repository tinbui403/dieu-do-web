<!doctype html>
<!-- FILE TẠO TỰ ĐỘNG từ src/app.src.html bằng build.py — đừng sửa trực tiếp file này. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B3C8C">
<title>Điều độ · Đại Cát Lâm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234B3C8C'/%3E%3Cpath d='M4 15h9V8H4zM13 10.5h3l2.5 2.5v2H13z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Ccircle cx='7' cy='17' r='1.6' fill='white'/%3E%3Ccircle cx='16' cy='17' r='1.6' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EFECF8;--surface:#FFFFFF;--ink:#2B2640;--muted:#625C7A;--faint:#8A849E;
  --line:#E1DCF2;--line2:#F1EEFB;--soft:#F7F5FD;--soft2:#FAF9FE;
  --pri:#5B4BB7;--pri-ink:#3E3190;--pri-soft:#E6E2F7;
  --side:#4B3C8C;--side-ink:#E4DFF7;--side-h:#C7BEEE;--side-sub:#D9D3F4;
  --red:#B42318;--red-bg:#FBE4E1;--red-ink:#A3261A;
  --amb:#E0A43A;--amb-bg:#FBEBD5;--amb-ink:#7A4700;
  --teal:#3E9C94;--teal-bg:#E0F1EF;--teal-ink:#10605A;--green-ink:#256B3A;
  --lav:#EEEBF8;--lav-ink:#4B3C8C;--zalo:#0068FF;
  --font:'Be Vietnam Pro','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:var(--pri-ink)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.mono{font-family:var(--mono);font-weight:600;letter-spacing:.01em}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;background:var(--side);color:#fff;display:flex;flex-direction:column;gap:20px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-logo{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--side-sub)}
.nav-h{padding:0 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--side-h)}
.nav-g{display:flex;flex-direction:column;gap:3px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--side-ink);font-size:14px;font-weight:500;text-align:left}
.nav-i:hover{background:rgba(255,255,255,.10)}
.nav-i[aria-current="page"]{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.nav-i .cnt{margin-left:auto;min-width:24px;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600;text-align:center;background:rgba(255,255,255,.16);color:#fff}
.nav-i[aria-current="page"] .cnt{background:#fff;color:var(--pri-ink)}
.langs{display:flex;gap:4px;padding:4px;border-radius:10px;background:rgba(255,255,255,.12)}
.langs button{flex:1;min-height:34px;border:0;border-radius:8px;background:transparent;color:var(--side-ink);font-size:13px;font-weight:600}
.langs button[aria-pressed="true"]{background:#fff;color:var(--pri-ink)}
.me{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.16)}
.avatar{width:34px;height:34px;border-radius:999px;background:var(--pri-soft);color:var(--pri-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.me .out{border:0;background:transparent;color:var(--side-sub);font-size:12px;text-decoration:underline;padding:4px 6px;white-space:nowrap}
.th-sort{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;white-space:nowrap}
.th-sort.on{color:var(--pri-ink)}
.th-sort:hover{text-decoration:underline}
.me-acts{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end}
.pw-row{position:relative}
.pw-row input{padding-right:78px!important}
.pw-eye{position:absolute;right:4px;top:4px;bottom:4px;border:0;border-radius:6px;background:var(--soft);color:var(--pri-ink);font-size:12px;font-weight:600;padding:0 10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px;min-height:70px}
.top h1{margin:0;font-size:21px;font-weight:700;color:var(--pri-ink);letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center}
.search{position:relative;width:300px}
.search svg{position:absolute;left:12px;top:12px}
.search input{width:100%;height:40px;padding:0 12px 0 36px;border-radius:10px;border:1px solid #D8D2EE;background:var(--soft)}
.content{padding:22px 28px 60px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:99px;background:#9A95AE;display:inline-block}
.live.on i{background:#2E9E63}
.bottom-nav{display:none}
.scrim{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid #D8D2EE;background:#fff;color:var(--pri-ink);font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn-pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn-pri:hover{background:#4E3FA6}
.btn-sm{min-height:34px;padding:0 11px;font-size:12px;border-radius:8px}
.btn-ok{background:var(--teal-bg);border-color:#A9D6CF;color:var(--teal-ink)}
.btn-zalo{background:var(--zalo);border-color:var(--zalo);color:#fff}
.btn-line{border-color:var(--pri);color:var(--pri-ink)}
.btn-danger{border-color:#F0B8B1;color:var(--red-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #D8D2EE;background:#fff;color:var(--ink);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pri-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-size:12px;font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--pri)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{height:40px;padding:0 10px;border-radius:8px;border:1px solid #D8D2EE;background:#fff;font-size:14px;font-weight:400;color:var(--ink);width:100%}
.field textarea{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--soft);color:var(--muted)}
.field.chkf{flex-direction:row;align-items:center;gap:8px;min-height:40px}
.field.chkf input{width:18px;height:18px;accent-color:var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}

/* ---------- cards & tables ---------- */
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px rgba(62,49,144,.05)}
.card h2{margin:0;font-size:15px;font-weight:700}
.band{display:flex;align-items:center;gap:12px}
.band span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
.band i{flex:1;height:1px;background:#D8D2EE}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}
.tile{display:flex;flex-direction:column;gap:10px}
.tile .lab{font-size:13px;font-weight:600;color:var(--muted)}
.tile .val{font-size:32px;font-weight:700;letter-spacing:-.02em}
.tile .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--faint)}
.tag{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.tbl{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl-x{overflow-x:auto}
.tbl-h{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbl-h h2{margin:0;font-size:15px;font-weight:700;color:var(--pri-ink)}
.tr{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:0 18px;min-height:44px;border-bottom:1px solid var(--line2);min-width:var(--minw,0)}
.tr:last-child{border-bottom:0}
.tr.th{min-height:36px;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft2)}
.tr:not(.th):hover{background:var(--soft2)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk{background:none;border:0;padding:0;color:var(--pri-ink);text-align:left;font-size:13px}
.lk:hover{text-decoration:underline}
.lk.mono{font-size:13px}
.cnt-b{padding:1px 9px;border-radius:999px;background:var(--pri-soft);color:var(--pri-ink);font-size:12px;font-weight:700}
.empty{padding:40px 20px;text-align:center;background:#fff;border:1px dashed #D8D2EE;border-radius:12px;color:var(--muted)}
.bar-bg{height:10px;border-radius:5px;background:var(--line2)}
.bar{height:10px;border-radius:5px}
.heat-row{display:grid;grid-template-columns:190px repeat(14,minmax(0,1fr)) 36px;gap:4px;align-items:center}
.heat-c{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.legend-i{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 8px;border:0;border-radius:6px;background:transparent;width:100%;text-align:left;font-size:13px}
.legend-i:hover{background:var(--soft)}
.todo-i{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;width:100%;text-align:left;font-size:13px}
.todo-i:hover{background:var(--soft)}
.todo-i b{min-width:32px;padding:2px 8px;border-radius:6px;background:var(--lav);color:var(--pri-ink);text-align:center}

/* ---------- suggestions ---------- */
.gy-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
.gy-card{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(62,49,144,.05)}
.gy-card.sel{border:2px solid var(--pri);box-shadow:0 4px 14px rgba(62,49,144,.14)}
.gy-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:12px 16px;border:0;background:transparent;text-align:left}
.gy-side{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px 14px;background:var(--soft2);border-radius:0 12px 12px 0;min-width:140px}
.panel{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.order{margin:0;white-space:pre-wrap;font-family:var(--mono),'Noto Sans SC',monospace;font-size:12px;line-height:1.6;background:var(--soft);border:1px solid #ECE8F8;border-radius:8px;padding:12px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}

/* ---------- drawer / modal ---------- */
.drawer-wrap{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(43,38,64,.32)}
.drawer-wrap>.close-area{flex:1;border:0;background:transparent}
.drawer{width:560px;max-width:100%;height:100%;overflow-y:auto;background:#fff;box-shadow:-8px 0 24px rgba(43,38,64,.18);display:flex;flex-direction:column}
.drawer-h{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:flex-start;gap:12px}
.drawer-b{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.drawer-f{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;justify-content:flex-end}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;line-height:1.3;color:var(--muted)}
.step b{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:99px;font-size:12px;background:#EEEDF3;color:#6E6985}
.step.done b{background:var(--pri-soft);color:var(--pri-ink)}
.step.cur b{background:var(--pri);color:#fff}
.step.cur{color:var(--ink);font-weight:600}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h3{margin:0;font-size:13px;font-weight:700;color:var(--pri-ink)}
.x-btn{width:40px;height:40px;border-radius:10px;border:1px solid #D8D2EE;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- toast & login ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;padding:12px 18px;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(43,38,64,.3);max-width:min(640px,calc(100vw - 32px));display:none}
#toast.show{display:block}
#toast.err{background:var(--red)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(180deg,var(--side) 0 38%,var(--bg) 38% 100%)}
.login-card{width:420px;max-width:100%;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(43,38,64,.18);display:flex;flex-direction:column;gap:16px}
.login-card h1{margin:0;font-size:22px;color:var(--pri-ink)}
.tabs2{display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--soft)}
.tabs2 button{flex:1;min-height:36px;border:0;border-radius:8px;background:transparent;font-weight:600;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:#fff;color:var(--pri-ink);box-shadow:0 1px 3px rgba(43,38,64,.12)}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--lav);color:var(--lav-ink)}
.msg.err{background:var(--red-bg);color:var(--red-ink)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gy-layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s ease;visibility:hidden}
  .app.nav-open .side{transform:none;visibility:visible;box-shadow:8px 0 24px rgba(43,38,64,.25)}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(43,38,64,.32);border:0}
  .menu-btn{display:flex}
  .top{padding:10px 14px;min-height:60px;gap:10px}
  .top h1{font-size:18px}
  .top .sub,.top .search,.top .live{display:none}
  .content{padding:14px 14px 96px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .heat-row{grid-template-columns:110px repeat(14,minmax(0,1fr)) 28px}
  .gy-card{flex-direction:column}
  .gy-side{border-radius:0 0 12px 12px;flex-direction:row;align-items:center;justify-content:space-between}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:4px 6px calc(8px + env(safe-area-inset-bottom))}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;border:0;background:transparent;font-size:11px;font-weight:500;color:var(--muted)}
  .bottom-nav button[aria-current="page"]{color:var(--pri);font-weight:700}
  .bottom-nav .bdg{min-width:16px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;line-height:16px}
  #toast{bottom:84px}
  .top .btn span{display:none}
  .top .btn{padding:0 12px}
  .cards .tbl-x{overflow:visible}
  .cards .tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 14px;min-width:0!important}
  .cards .tr.th{display:none}
  .cards .tr>:empty{display:none}
  .cards .tr>:first-child{flex-basis:100%;font-size:15px}
  .cards .tr>.btn{margin-left:auto}
  .cards [data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px;font-weight:400}
}
@media (max-width:560px){
  .g4{grid-template-columns:minmax(0,1fr)}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div id="root"><div class="loading">Đang tải… 加载中…</div></div>

function contBtn(c) { return c.so_cont ? '<button class="lk mono" data-act="open-cont" data-id="' + esc(c.id) + '">' + esc(c.so_cont) + '</button>' : '<button class="lk" style="font-style:italic;color:var(--muted)" data-act="open-cont" data-id="' + esc(c.id) + '">' + esc(T('noCont')) + '</button>'; }
function nextBtn(c) { const nx = NEXT[c.trang_thai]; if (!nx || !canWrite()) return '<span></span>'; return '<button class="btn btn-sm btn-line" data-act="move" data-id="' + esc(c.id) + '" data-to="' + nx[0] + '">' + esc(T(nx[1])) + ' →</button>'; }
function loOrder(a, b) {
  const la = S.lots[a.lo] || {}, lb = S.lots[b.lo] || {};
  const ta = la.thu_tu != null ? la.thu_tu : 1e9, tb = lb.thu_tu != null ? lb.thu_tu : 1e9;
  if (ta !== tb) return ta - tb;
  const r = String(a.lo || '~').localeCompare(String(b.lo || '~'), 'vi', { numeric:true });
  return r || String(a.so_cont || a.ma_don || a.id).localeCompare(String(b.so_cont || b.ma_don || b.id));
}
function vTaiKho() {

const LO_SORTS = [['closing', ['Closing gần nhất', '截关时间']], ['thu_tu', ['Thứ tự tự đặt', '自定顺序']], ['lo', ['Số lô', '批次号']], ['etd', ['ETD', 'ETD']], ['booking', ['Booking', '订舱号']], ['hang_tau', ['Hãng tàu', '船公司']], ['so_luong', ['Số lượng cont', '柜数']], ['moi', ['Mới cập nhật', '最近更新']]];
function loKey(l, k) {
  if (k === 'closing') return l.closing ? +new Date(l.closing) : null;
  if (k === 'etd') return l.etd || l.etd_kho || null;
  if (k === 'moi') return l.cap_nhat_luc ? +new Date(l.cap_nhat_luc) : null;
  if (k === 'so_luong') return l.so_luong_cont != null ? l.so_luong_cont : (l.so_cont || null);
  if (k === 'thu_tu') return l.thu_tu != null ? l.thu_tu : null;
  return l[k] == null || l[k] === '' ? null : l[k];
}
function sortLots(arr) {
  const k = LO_SORT.k, d = LO_SORT.d;
  return arr.sort((a, b) => {
    const x = loKey(a, k), y = loKey(b, k);
    if (x == null && y == null) return String(a.lo).localeCompare(String(b.lo), 'vi', { numeric:true });
    if (x == null) return 1; if (y == null) return -1;   // ô trống luôn nằm cuối
    const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'vi', { numeric:true });
    return (r || String(a.lo).localeCompare(String(b.lo), 'vi', { numeric:true })) * d;
  });
}
function setLoSort(k, d) { LO_SORT = { k, d }; try { localStorage.setItem('dd_lo_sort', JSON.stringify(LO_SORT)); } catch (e) {} renderMain(); }
function sortHead(k, label, extra) {

}

  if (['gia_bao', 'phu_phi_xe', 'tong_tien', 'phi_phat_sinh'].indexOf(f) > -1) return money(v);

function formObj(form) {
  const o = {};
  form.querySelectorAll('input[name],select[name],textarea[name]').forEach(el => {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'datetime-local') o[el.name] = inputToTs(el.value);
    else if (el.type === 'number') o[el.name] = el.value === '' ? null : Number(el.value);
    else { const v = el.value.trim(); o[el.name] = v === '' ? null : v; }
  });
  return o;
}

async function doResetPw(f) {
  const p1 = f.p1.value, p2 = f.p2.value;
  if (p1.length < 6) { renderResetPw('Mật khẩu cần ít nhất 6 ký tự. 密码至少6位。', true); return; }
  if (p1 !== p2) { renderResetPw('Hai lần nhập không giống nhau. 两次输入不一致。', true); return; }
  const b = document.getElementById('reset-btn'); if (b) { b.disabled = true; b.textContent = 'Đang lưu… 保存中…'; }
  try {
    const r = await sb.auth.updateUser({ password: p1 }); if (r.error) throw r.error;
    RECOVERY = false;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    const { data } = await sb.auth.getSession();
    if (data.session) afterLogin(data.session);
    else { LOGIN_MODE = 'in'; renderLogin('Đã đặt mật khẩu mới — đăng nhập lại nhé. 新密码已设置，请重新登录。'); }
  } catch (e) { renderResetPw(errMsg(e), true); }

async function doLogin(f) {
  const email = f.email.value.trim().toLowerCase(), password = f.password.value;

  const b = document.getElementById('login-btn'); b.disabled = true;
  try {
    if (LOGIN_MODE === 'in') { const r = await sb.auth.signInWithPassword({ email, password }); if (r.error) throw r.error; }
    else { const r = await sb.auth.signUp({ email, password }); if (r.error) throw r.error; if (!r.data.session) { LOGIN_MODE = 'in'; renderLogin('Đã tạo tài khoản. Mở email để bấm xác nhận, rồi quay lại đăng nhập. 账号已创建，请到邮箱确认后再登录。'); return; } }
  } catch (e) {
    const m = String(e.message || e);
    renderLogin(/Invalid login/i.test(m) ? 'Sai email hoặc mật khẩu. 邮箱或密码错误。' : /confirm/i.test(m) ? 'Email chưa được xác nhận — mở hộp thư để bấm link xác nhận. 邮箱未确认。' : /already registered/i.test(m) ? 'Email này đã có tài khoản — chọn Đăng nhập. 该邮箱已注册，请登录。' : m, true);
  }
}

(async function init() {

    if (ev === 'SIGNED_IN' && !S.session && session) afterLogin(session);

  });

  if (/error_description=/.test(h)) {          // link hết hạn hoặc đã dùng rồi
    const m = decodeURIComponent((h.match(/error_description=([^&]*)/) || [])[1] || '').replace(/\+/g, ' ');
    RECOVERY = false;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    renderLogin('Link không dùng được nữa (hết hạn hoặc đã dùng) — bấm “Quên mật khẩu?” để xin link mới. ' + m, true);
    return;
  }
  const { data } = await sb.auth.getSession();
  if (RECOVERY) { renderResetPw(); return; }
  if (data.session) afterLogin(data.session); else renderLogin();
})();
</script>
